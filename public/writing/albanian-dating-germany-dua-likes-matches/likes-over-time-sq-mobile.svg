<svg xmlns="http://www.w3.org/2000/svg" width="420" height="655" viewBox="0 0 420 655" role="img" aria-labelledby="title desc"><title id="title">Nëse do të kishte 35.000 pëlqime çdo ditë</title><desc id="desc">Nëse do të kishte 35.000 pëlqime çdo ditë. 1 ditë: 35.000 pëlqime; 7 ditë: 245.000 pëlqime; 30 ditë: 1.050.000 pëlqime</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Nëse do të kishte</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">35.000 pëlqime çdo ditë</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull me bazë ditore të pandryshuar;</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">numërohen veprimet, jo njerëzit unikë apo</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultate mujore të vëzhguara.</text><path d="M 24 210.6 H 396" stroke="#d9d3c8"/><text x="24" y="235.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1 ditë</text><text x="396" y="275.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">35.000 pëlqime</text><rect x="24" y="287.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="287.8" width="12.400" height="22" rx="3" fill="#a87653"/><text x="24" y="339.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">7 ditë</text><text x="396" y="380.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">245.000 pëlqime</text><rect x="24" y="392.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="392.0" width="86.800" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="444.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">30 ditë</text><text x="396" y="484.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">1.050.000 pëlqime</text><rect x="24" y="496.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="496.2" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="568.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull me bazë ditore të pandryshuar;</text><text x="24" y="589.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">numërohen veprimet, jo njerëzit unikë apo</text><text x="24" y="610.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultate mujore të vëzhguara.</text></svg>
