<svg xmlns="http://www.w3.org/2000/svg" width="900" height="781" viewBox="0 0 900 781" role="img" aria-labelledby="title desc"><title id="title">Katër shifra, katër kuptime të ndryshme</title><desc id="desc">Katër shifra, katër kuptime të ndryshme. Komuniteti: Njerëzit që kemi parasysh kur flasim për shqiptarët në Gjermani. Anëtarët e regjistruar: Llogari në një platformë. Regjistrimi nuk tregon kush është aktiv sot. Pëlqimet dhe match-et: Veprime dhe pëlqime të ndërsjella. Një person mund të marrë pjesë në shumë prej tyre. Lidhjet: Jeta jashtë aplikacionit. Numri i match-eve nuk tregon sa çifte martohen.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Katër shifra, katër kuptime të</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">ndryshme</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Si lexohen shifrat e videos</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Komuniteti</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Njerëzit që kemi parasysh</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">kur flasim për shqiptarët</text><text x="58.0" y="388.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">në Gjermani.</text><rect x="460.0" y="248.0" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Anëtarët e regjistruar</text><text x="478.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Llogari në një platformë.</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Regjistrimi nuk tregon</text><text x="478.0" y="388.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">kush është aktiv sot.</text><rect x="40.0" y="461.79999999999995" width="400.0" height="225.99999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="493.79999999999995" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Pëlqimet dhe match-et</text><text x="58.0" y="538.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Veprime dhe pëlqime të</text><text x="58.0" y="570.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">ndërsjella. Një person</text><text x="58.0" y="602.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">mund të marrë pjesë në</text><text x="58.0" y="634.6000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">shumë prej tyre.</text><rect x="460.0" y="461.79999999999995" width="400.0" height="225.99999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="493.79999999999995" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Lidhjet</text><text x="478.0" y="538.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Jeta jashtë aplikacionit.</text><text x="478.0" y="570.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Numri i match-eve nuk</text><text x="478.0" y="602.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">tregon sa çifte martohen.</text><text x="40" y="715.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Përkufizime dhe interpretim; nuk nënkuptohet një normë suksesi.</text></svg>
