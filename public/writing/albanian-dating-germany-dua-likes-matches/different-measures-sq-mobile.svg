<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1010" viewBox="0 0 420 1010" role="img" aria-labelledby="title desc"><title id="title">Katër shifra, katër kuptime të ndryshme</title><desc id="desc">Katër shifra, katër kuptime të ndryshme. Komuniteti: Njerëzit që kemi parasysh kur flasim për shqiptarët në Gjermani. Anëtarët e regjistruar: Llogari në një platformë. Regjistrimi nuk tregon kush është aktiv sot. Pëlqimet dhe match-et: Veprime dhe pëlqime të ndërsjella. Një person mund të marrë pjesë në shumë prej tyre. Lidhjet: Jeta jashtë aplikacionit. Numri i match-eve nuk tregon sa çifte martohen.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Katër shifra, katër</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">kuptime të ndryshme</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Si lexohen shifrat e videos</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Komuniteti</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Njerëzit që kemi parasysh kur</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">flasim për shqiptarët në</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gjermani.</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Anëtarët e regjistruar</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Llogari në një platformë.</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Regjistrimi nuk tregon kush</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">është aktiv sot.</text><rect x="24" y="565.1999999999999" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="597.1999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pëlqimet dhe match-et</text><text x="42" y="634.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Veprime dhe pëlqime të</text><text x="42" y="659.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ndërsjella. Një person mund të</text><text x="42" y="684.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">marrë pjesë në shumë prej tyre.</text><rect x="24" y="750.9999999999999" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="782.9999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Lidhjet</text><text x="42" y="820.1999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Jeta jashtë aplikacionit. Numri</text><text x="42" y="845.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">i match-eve nuk tregon sa çifte</text><text x="42" y="870.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">martohen.</text><text x="24" y="944.7999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Përkufizime dhe interpretim; nuk</text><text x="24" y="965.7999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">nënkuptohet një normë suksesi.</text></svg>
