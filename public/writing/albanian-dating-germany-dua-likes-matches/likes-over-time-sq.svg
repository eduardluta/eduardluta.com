<svg xmlns="http://www.w3.org/2000/svg" width="900" height="726" viewBox="0 0 900 726" role="img" aria-labelledby="title desc"><title id="title">Nëse do të kishte 35.000 pëlqime çdo ditë</title><desc id="desc">Nëse do të kishte 35.000 pëlqime çdo ditë. 1 ditë: 35.000 pëlqime; 7 ditë: 245.000 pëlqime; 30 ditë: 1.050.000 pëlqime</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Nëse do të kishte 35.000 pëlqime çdo</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">ditë</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembull me bazë ditore të pandryshuar; numërohen veprimet, jo njerëzit unikë</text><text x="40" y="210.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">apo rezultate mujore të vëzhguara.</text><path d="M 40 248.2 H 860" stroke="#d9d3c8"/><text x="40" y="273.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">1 ditë</text><text x="860" y="323.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">35.000 pëlqime</text><rect x="40" y="335.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="335.4" width="27.333" height="22" rx="3" fill="#a87653"/><text x="40" y="387.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">7 ditë</text><text x="860" y="437.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">245.000 pëlqime</text><rect x="40" y="449.59999999999997" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="449.59999999999997" width="191.333" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="501.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">30 ditë</text><text x="860" y="551.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">1.050.000 pëlqime</text><rect x="40" y="563.8" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="563.8" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="607.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="607.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="635.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembull me bazë ditore të pandryshuar; numërohen veprimet, jo njerëzit unikë</text><text x="40" y="661.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">apo rezultate mujore të vëzhguara.</text></svg>
