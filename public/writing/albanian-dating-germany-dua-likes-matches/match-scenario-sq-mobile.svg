<svg xmlns="http://www.w3.org/2000/svg" width="420" height="639" viewBox="0 0 420 639" role="img" aria-labelledby="title desc"><title id="title">Çfarë do të thoshin 1.000 match-e në ditë</title><desc id="desc">Çfarë do të thoshin 1.000 match-e në ditë. 7 ditë: 7.000: 1.000 × 7. Shumë e match-eve, jo 7.000 çifte të ndryshme në një lidhje. 30 ditë: 30.000: 1.000 × 30. Vetëm nëse ky nivel ditor ruhet; jo total mujor i verifikuar.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Çfarë do të thoshin</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">1.000 match-e në ditë</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Llogaritje, jo parashikim</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">7 ditë: 7.000</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1.000 × 7. Shumë e match-eve,</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">jo 7.000 çifte të ndryshme në</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">një lidhje.</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">30 ditë: 30.000</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1.000 × 30. Vetëm nëse ky nivel</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ditor ruhet; jo total mujor i</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">verifikuar.</text><text x="24" y="573.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Supozimi: saktësisht 1.000 match-e në</text><text x="24" y="594.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">secilën ditë.</text></svg>
