<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Upper-left teeth 25 and 26 on a traditional tooth-organ meridian map</title>
  <desc id="desc">A focused diagram showing the upper-left canine, premolars, and molars. Teeth 25 and 26 are highlighted as extracted. Traditional charts associate tooth 25 with the lung and large intestine group and tooth 26 with the stomach, spleen, and pancreas group. A disclaimer states that these are traditional associations, not clinical anatomy.</desc>

  <rect width="1200" height="760" fill="#f7f4ee"/>

  <g fill="#1b1712">
    <text x="70" y="72" font-family="Georgia, serif" font-size="40" font-weight="700">Your upper-left teeth on the traditional map</text>
    <text x="70" y="111" font-family="IBM Plex Mono, monospace" font-size="16" letter-spacing="1.4" fill="#766f65">FDI 25–26  ·  UNIVERSAL 13–14  ·  FOCUSED EXCERPT</text>
  </g>
  <rect x="1001" y="94" width="18" height="18" rx="2" fill="#d97a58" stroke="#8f3f28" stroke-width="2"/>
  <text x="1030" y="109" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.2" fill="#8f3f28">EXTRACTED</text>

  <g font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.2" fill="#766f65">
    <text x="72" y="172">MIDLINE</text>
    <text x="1010" y="172">BACK OF MOUTH</text>
  </g>
  <path d="M80 188 Q600 128 1120 188" fill="none" stroke="#bcb4a8" stroke-width="2" stroke-dasharray="5 8"/>

  <defs>
    <path id="front-tooth" d="M8 10 Q23 -2 39 9 Q55 -2 70 10 L66 65 Q63 85 54 100 L49 144 Q47 157 39 157 Q31 157 29 144 L24 100 Q15 85 12 65 Z"/>
    <path id="premolar" d="M5 14 Q21 -5 42 10 Q62 -5 79 14 L74 67 Q71 87 60 103 L54 151 Q52 166 43 166 Q34 166 32 151 L25 103 Q14 87 10 67 Z"/>
    <path id="molar" d="M3 17 Q20 -4 42 11 Q64 -5 87 17 L82 68 Q80 89 68 103 L64 150 Q62 166 53 166 Q45 166 43 150 L39 116 L35 150 Q33 166 25 166 Q16 166 14 150 L11 103 Q6 87 7 68 Z"/>
  </defs>

  <g transform="translate(80 196)" fill="#efe9de" stroke="#766f65" stroke-width="2">
    <use href="#front-tooth" x="0"/>
    <use href="#front-tooth" x="115"/>
    <use href="#front-tooth" x="230"/>
    <use href="#premolar" x="350"/>
    <use href="#premolar" x="480" fill="#d97a58" stroke="#8f3f28" stroke-width="3"/>
    <use href="#molar" x="620" fill="#d97a58" stroke="#8f3f28" stroke-width="3"/>
    <use href="#molar" x="780"/>
    <use href="#molar" x="930"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="17" font-weight="700" fill="#1b1712">
      <text x="119" y="395">21</text>
      <text x="234" y="395">22</text>
      <text x="349" y="395">23</text>
      <text x="473" y="395">24</text>
      <text x="602" y="395" fill="#8f3f28">25</text>
      <text x="743" y="395" fill="#8f3f28">26</text>
      <text x="867" y="395">27</text>
      <text x="1017" y="395">28</text>
    </g>
    <g font-size="12" fill="#766f65">
      <text x="349" y="418">EYE TOOTH</text>
      <text x="473" y="418">1ST AFTER</text>
      <text x="602" y="418" fill="#8f3f28">2ND AFTER</text>
      <text x="743" y="418" fill="#8f3f28">3RD AFTER</text>
    </g>
  </g>

  <path d="M602 430 L602 458 L310 458 L310 484" fill="none" stroke="#2f5d4f" stroke-width="2"/>
  <path d="M743 430 L743 458 L890 458 L890 484" fill="none" stroke="#2f5d4f" stroke-width="2"/>

  <g>
    <rect x="70" y="484" width="500" height="164" rx="5" fill="#eee8dd" stroke="#2f5d4f" stroke-width="2"/>
    <text x="100" y="522" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2f5d4f">TOOTH 25 · SECOND PREMOLAR</text>
    <text x="100" y="562" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#1b1712">Lung · Large intestine</text>
    <text x="100" y="592" font-family="IBM Plex Mono, monospace" font-size="14" fill="#766f65">Common additions: sinuses</text>
    <text x="100" y="618" font-family="IBM Plex Mono, monospace" font-size="14" fill="#766f65">Expanded Voll-style charts: thymus</text>
  </g>

  <g>
    <rect x="630" y="484" width="500" height="164" rx="5" fill="#eee8dd" stroke="#2f5d4f" stroke-width="2"/>
    <text x="660" y="522" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2f5d4f">TOOTH 26 · FIRST MOLAR</text>
    <text x="660" y="562" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#1b1712">Stomach · Spleen / Pancreas</text>
    <text x="660" y="592" font-family="IBM Plex Mono, monospace" font-size="14" fill="#766f65">Common addition: maxillary sinus</text>
    <text x="660" y="618" font-family="IBM Plex Mono, monospace" font-size="14" fill="#766f65">Expanded charts: thyroid + mammary gland</text>
  </g>

  <line x1="70" y1="688" x2="1130" y2="688" stroke="#bcb4a8"/>
  <text x="600" y="721" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing=".5" fill="#766f65">
    TRADITIONAL EAV/VOLL MERIDIAN ASSOCIATIONS · NOT CLINICAL ANATOMY OR PROOF OF CAUSATION
  </text>
</svg>
