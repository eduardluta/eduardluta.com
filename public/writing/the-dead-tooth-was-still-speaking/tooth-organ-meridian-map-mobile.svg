<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Upper-left teeth 25 and 26 on a traditional tooth-organ meridian map</title>
  <desc id="desc">A mobile-focused diagram showing the upper-left canine, first premolar, second premolar, and first molar. Teeth 25 and 26 are highlighted as extracted. Traditional charts associate tooth 25 with the lung and large intestine group and tooth 26 with the stomach, spleen, and pancreas group.</desc>

  <rect width="720" height="1080" fill="#f7f4ee"/>

  <text x="42" y="64" font-family="Georgia, serif" font-size="36" font-weight="700" fill="#1b1712">Your teeth on the traditional map</text>
  <text x="42" y="103" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="1.2" fill="#766f65">UPPER LEFT  ·  FDI 25–26  ·  UNIVERSAL 13–14</text>

  <rect x="42" y="133" width="18" height="18" rx="2" fill="#d97a58" stroke="#8f3f28" stroke-width="2"/>
  <text x="72" y="148" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing="1.2" fill="#8f3f28">EXTRACTED</text>

  <text x="42" y="199" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.1" fill="#766f65">EYE TOOTH</text>
  <text x="624" y="199" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.1" fill="#766f65">TOWARD MOLARS</text>
  <path d="M52 216 Q360 174 668 216" fill="none" stroke="#bcb4a8" stroke-width="2" stroke-dasharray="5 8"/>

  <defs>
    <path id="canine" d="M8 10 Q23 -2 39 9 Q55 -2 70 10 L66 65 Q63 85 54 100 L49 144 Q47 157 39 157 Q31 157 29 144 L24 100 Q15 85 12 65 Z"/>
    <path id="premolar" d="M5 14 Q21 -5 42 10 Q62 -5 79 14 L74 67 Q71 87 60 103 L54 151 Q52 166 43 166 Q34 166 32 151 L25 103 Q14 87 10 67 Z"/>
    <path id="molar" d="M3 17 Q20 -4 42 11 Q64 -5 87 17 L82 68 Q80 89 68 103 L64 150 Q62 166 53 166 Q45 166 43 150 L39 116 L35 150 Q33 166 25 166 Q16 166 14 150 L11 103 Q6 87 7 68 Z"/>
  </defs>

  <g transform="translate(72 228)" fill="#efe9de" stroke="#766f65" stroke-width="2.5">
    <use href="#canine" x="0"/>
    <use href="#premolar" x="150"/>
    <use href="#premolar" x="310" fill="#d97a58" stroke="#8f3f28" stroke-width="3.5"/>
    <use href="#molar" x="480" fill="#d97a58" stroke="#8f3f28" stroke-width="3.5"/>
  </g>

  <g font-family="IBM Plex Mono, monospace" text-anchor="middle">
    <g font-size="19" font-weight="700" fill="#1b1712">
      <text x="111" y="422">23</text>
      <text x="265" y="422">24</text>
      <text x="425" y="422" fill="#8f3f28">25</text>
      <text x="595" y="422" fill="#8f3f28">26</text>
    </g>
    <g font-size="12" fill="#766f65">
      <text x="111" y="447">EYE TOOTH</text>
      <text x="265" y="447">1ST AFTER</text>
      <text x="425" y="447" fill="#8f3f28">2ND AFTER</text>
      <text x="595" y="447" fill="#8f3f28">3RD AFTER</text>
    </g>
  </g>

  <g>
    <rect x="42" y="490" width="636" height="208" rx="6" fill="#eee8dd" stroke="#2f5d4f" stroke-width="2"/>
    <text x="72" y="533" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2f5d4f">TOOTH 25 · SECOND PREMOLAR</text>
    <text x="72" y="579" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#1b1712">Lung · Large intestine</text>
    <text x="72" y="621" font-family="IBM Plex Mono, monospace" font-size="16" fill="#766f65">Common addition: sinuses</text>
    <text x="72" y="654" font-family="IBM Plex Mono, monospace" font-size="16" fill="#766f65">Expanded Voll-style charts: thymus</text>
  </g>

  <g>
    <rect x="42" y="727" width="636" height="225" rx="6" fill="#eee8dd" stroke="#2f5d4f" stroke-width="2"/>
    <text x="72" y="770" font-family="IBM Plex Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.1" fill="#2f5d4f">TOOTH 26 · FIRST MOLAR</text>
    <text x="72" y="816" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1b1712">Stomach · Spleen / Pancreas</text>
    <text x="72" y="858" font-family="IBM Plex Mono, monospace" font-size="16" fill="#766f65">Common addition: maxillary sinus</text>
    <text x="72" y="891" font-family="IBM Plex Mono, monospace" font-size="16" fill="#766f65">Expanded charts: thyroid</text>
    <text x="72" y="922" font-family="IBM Plex Mono, monospace" font-size="16" fill="#766f65">and mammary gland</text>
  </g>

  <line x1="42" y1="994" x2="678" y2="994" stroke="#bcb4a8"/>
  <text x="360" y="1025" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing=".4" fill="#766f65">TRADITIONAL EAV/VOLL ASSOCIATIONS</text>
  <text x="360" y="1052" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" letter-spacing=".4" fill="#766f65">NOT CLINICAL ANATOMY OR PROOF OF CAUSATION</text>
</svg>
