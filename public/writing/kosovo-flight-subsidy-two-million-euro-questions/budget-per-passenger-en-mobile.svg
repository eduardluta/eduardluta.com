<svg xmlns="http://www.w3.org/2000/svg" width="420" height="655" viewBox="0 0 420 655" role="img" aria-labelledby="title desc"><title id="title">The same budget, different denominators</title><desc id="desc">The same budget, different denominators. 20,000 journeys: €100 / journey; 50,000 journeys: €40 / journey; 100,000 journeys: €20 / journey</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">The same budget,</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">different denominators</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">€2m divided by hypothetical one-way</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">passenger journeys. Not actual payouts or</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">fare reductions.</text><path d="M 24 210.6 H 396" stroke="#d9d3c8"/><text x="24" y="235.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">20,000 journeys</text><text x="396" y="275.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€100 / journey</text><rect x="24" y="287.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="287.8" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="339.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">50,000 journeys</text><text x="396" y="380.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€40 / journey</text><rect x="24" y="392.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="392.0" width="148.800" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="444.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">100,000 journeys</text><text x="396" y="484.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€20 / journey</text><rect x="24" y="496.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="496.2" width="74.400" height="22" rx="3" fill="#a87653"/><text x="24" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="568.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">€2m divided by hypothetical one-way</text><text x="24" y="589.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">passenger journeys. Not actual payouts or</text><text x="24" y="610.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">fare reductions.</text></svg>
