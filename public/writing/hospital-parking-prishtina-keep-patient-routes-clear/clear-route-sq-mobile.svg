<svg xmlns="http://www.w3.org/2000/svg" width="420" height="766" viewBox="0 0 420 766" role="img" aria-labelledby="title desc"><title id="title">Mbaje të kalueshme gjithë rrugën e mbërritjes</title><desc id="desc">Mbaje të kalueshme gjithë rrugën e mbërritjes. Oriento: Ndihmoji shoferët të gjejnë vend të përshtatshëm.. Ruaj: Mbaji të lira kalimin dhe pikat e qasjes.. Kontrollo: Pyeti pacientët nëse rruga funksionon realisht.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Mbaje të kalueshme</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">gjithë rrugën e</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">mbërritjes</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 206.39999999999998 H 396" stroke="#d9d3c8"/><rect x="24" y="231.39999999999998" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="263.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Oriento</text><text x="42" y="300.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ndihmoji shoferët të gjejnë</text><text x="42" y="325.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">vend të përshtatshëm.</text><rect x="24" y="392.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="424.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ruaj</text><text x="42" y="461.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Mbaji të lira kalimin dhe pikat</text><text x="42" y="486.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">e qasjes.</text><rect x="24" y="552.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="584.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kontrollo</text><text x="42" y="621.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Pyeti pacientët nëse rruga</text><text x="42" y="647.0000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">funksionon realisht.</text><text x="24" y="721.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
