<svg xmlns="http://www.w3.org/2000/svg" width="420" height="508" viewBox="0 0 420 508" role="img" aria-labelledby="title desc"><title id="title">Seven days: drafts and selection</title><desc id="desc">Seven days: drafts and selection. Rough openings: 21; Chosen to develop: 3 of 21</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Seven days: drafts and</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">selection</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hypothetical: 3 openings/day × 7 days. The</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3 chosen are included in the 21.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Rough openings</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">21</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Chosen to develop</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">3 of 21</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="53.143" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="414.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="414.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="442.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hypothetical: 3 openings/day × 7 days. The</text><text x="24" y="463.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3 chosen are included in the 21.</text></svg>
