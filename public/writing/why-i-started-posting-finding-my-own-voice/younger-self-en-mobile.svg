<svg xmlns="http://www.w3.org/2000/svg" width="420" height="678" viewBox="0 0 420 678" role="img" aria-labelledby="title desc"><title id="title">An audience of one: your younger self</title><desc id="desc">An audience of one: your younger self. Experience: What actually happened to you?. Interpretation: What do you now think it means?. Open question: What should that younger person investigate?</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">An audience of one:</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">your younger self</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Experience</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">What actually happened to you?</text><rect x="24" y="329.0" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="361.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Interpretation</text><text x="42" y="398.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">What do you now think it means?</text><rect x="24" y="464.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="496.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Open question</text><text x="42" y="533.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">What should that younger person</text><text x="42" y="558.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">investigate?</text><text x="24" y="633.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
