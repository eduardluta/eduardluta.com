<svg xmlns="http://www.w3.org/2000/svg" width="420" height="682" viewBox="0 0 420 682" role="img" aria-labelledby="title desc"><title id="title">What 1% would mean</title><desc id="desc">At a hypothetical 1% rate, one million dollars yields ten thousand, ten million yields one hundred thousand and one billion yields ten million.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">What 1% would mean</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hypothetical arithmetic of the spoken</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">formula</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><rect x="24" y="176.8" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="208.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">$1 million uncovered</text><text x="42" y="246.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">$1,000,000 × 0.01 = $10,000</text><rect x="24" y="312.20000000000005" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="344.20000000000005" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">$10 million uncovered</text><text x="42" y="381.40000000000003" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">$10,000,000 × 0.01 = $100,000</text><rect x="24" y="447.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="479.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">$1 billion uncovered</text><text x="42" y="516.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">$1,000,000,000 × 0.01 =</text><text x="42" y="542.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">$10,000,000</text><text x="24" y="616.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">US dollars • Hypothetical amounts, not</text><text x="24" y="637.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">verified rewards</text></svg>
