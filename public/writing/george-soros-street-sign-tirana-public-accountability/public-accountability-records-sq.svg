<svg xmlns="http://www.w3.org/2000/svg" width="900" height="634" viewBox="0 0 900 634" role="img" aria-labelledby="title desc"><title id="title">Ktheje pyetjen në dokumente</title><desc id="desc">Tri grupe dokumentesh: baza e emrit të rrugës, marrëdhëniet e dokumentuara dhe kushtet e pasojat e vendimeve publike konkrete.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Ktheje pyetjen në dokumente</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Listë editoriale, jo konstatime shkeljesh</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Emri</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Vendimi fillestar,</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">arsyetimi dhe çdo ndryshim</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">i mëvonshëm.</text><rect x="460.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Marrëdhënia</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Grante, përfitues, takime</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">dhe interesa të</text><text x="478.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">deklaruara, me data.</text><rect x="40" y="411.4" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="443.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Pasoja</text><text x="58" y="487.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Vendime publike konkrete, kushte, kosto dhe përfitues.</text><text x="40" y="568.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Pyetje editoriale • pa matje ndikimi ose fajësi të supozuar</text></svg>
