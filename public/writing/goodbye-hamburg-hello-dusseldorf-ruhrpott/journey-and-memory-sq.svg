<svg xmlns="http://www.w3.org/2000/svg" width="900" height="666" viewBox="0 0 900 666" role="img" aria-labelledby="title desc"><title id="title">Një destinacion dhe një vend kujtimesh</title><desc id="desc">Një destinacion dhe një vend kujtimesh. Hamburg: Lamtumira: një qytet që u bë personal përmes njerëzve që takova.. Düsseldorf: Destinacioni i radhës i përmendur në përshkrim.. Ruhrpott: Rajoni i fëmijërisë i përmendur në të njëjtin përshkrim. Rajon, jo emër tjetër për Düsseldorfin.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Një destinacion dhe një vend kujtimesh</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Hamburg</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Lamtumira: një qytet që u</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">bë personal përmes</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">njerëzve që takova.</text><rect x="460.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Düsseldorf</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Destinacioni i radhës i</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">përmendur në përshkrim.</text><rect x="40" y="411.4" width="820" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="443.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Ruhrpott</text><text x="58" y="487.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Rajoni i fëmijërisë i përmendur në të njëjtin përshkrim.</text><text x="58" y="519.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Rajon, jo emër tjetër për Düsseldorfin.</text><text x="40" y="601.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
