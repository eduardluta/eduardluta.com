<svg xmlns="http://www.w3.org/2000/svg" width="420" height="804" viewBox="0 0 420 804" role="img" aria-labelledby="title desc"><title id="title">Një destinacion dhe një vend kujtimesh</title><desc id="desc">Një destinacion dhe një vend kujtimesh. Hamburg: Lamtumira: një qytet që u bë personal përmes njerëzve që takova.. Düsseldorf: Destinacioni i radhës i përmendur në përshkrim.. Ruhrpott: Rajoni i fëmijërisë i përmendur në të njëjtin përshkrim. Rajon, jo emër tjetër për Düsseldorfin.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një destinacion dhe një</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">vend kujtimesh</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hamburg</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Lamtumira: një qytet që u bë</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">personal përmes njerëzve që</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">takova.</text><rect x="24" y="379.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Düsseldorf</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Destinacioni i radhës i</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përmendur në përshkrim.</text><rect x="24" y="540.0" width="372" height="191.0" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="572.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ruhrpott</text><text x="42" y="609.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Rajoni i fëmijërisë i përmendur</text><text x="42" y="634.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">në të njëjtin përshkrim. Rajon,</text><text x="42" y="659.6000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">jo emër tjetër për</text><text x="42" y="684.8000000000002" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Düsseldorfin.</text><text x="24" y="759.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
