<svg xmlns="http://www.w3.org/2000/svg" width="900" height="561" viewBox="0 0 900 561" role="img" aria-labelledby="title desc"><title id="title">Zona e RVR-së: 15 anëtarë</title><desc id="desc">Zona e RVR-së: 15 anëtarë. Qytete të pavarura: 11 qytete; Qarqe: 4 qarqe</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Zona e RVR-së: 15 anëtarë</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Regionalverband Ruhr: 11 + 4 = 15 njësi anëtare. Numërohen njësi</text><text x="40" y="159.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">administrative, jo pjesë të popullsisë.</text><path d="M 40 197.79999999999998 H 860" stroke="#d9d3c8"/><text x="40" y="222.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Qytete të pavarura</text><text x="860" y="273.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">11 qytete</text><rect x="40" y="285.0" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="285.0" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="337.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Qarqe</text><text x="860" y="387.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">4 qarqe</text><rect x="40" y="399.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="399.2" width="298.182" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="443.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="443.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="471.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Regionalverband Ruhr: 11 + 4 = 15 njësi anëtare. Numërohen njësi</text><text x="40" y="496.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">administrative, jo pjesë të popullsisë.</text></svg>
