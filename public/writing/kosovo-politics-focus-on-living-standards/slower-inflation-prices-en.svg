<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc"><title id="title">Slower inflation can still mean higher prices</title><desc id="desc">Slower inflation can still mean higher prices. Start: €100.00; After +10%: €110.00; Then +3%: €113.30</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Slower inflation can still mean higher</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">prices</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Hypothetical unchanged basket; not Kosovo price data.</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><text x="40" y="248.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Start</text><text x="860" y="298.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€100.00</text><rect x="40" y="310.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="310.2" width="723.742" height="22" rx="3" fill="#a87653"/><text x="40" y="362.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">After +10%</text><text x="860" y="412.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€110.00</text><rect x="40" y="424.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="424.4" width="796.117" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="476.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Then +3%</text><text x="860" y="526.5999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€113.30</text><rect x="40" y="538.5999999999999" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="538.5999999999999" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="582.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="582.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="40" y="610.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Hypothetical unchanged basket; not Kosovo price data.</text></svg>
