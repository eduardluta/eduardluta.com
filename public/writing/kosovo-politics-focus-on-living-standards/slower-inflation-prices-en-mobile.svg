<svg xmlns="http://www.w3.org/2000/svg" width="420" height="651" viewBox="0 0 420 651" role="img" aria-labelledby="title desc"><title id="title">Slower inflation can still mean higher prices</title><desc id="desc">Slower inflation can still mean higher prices. Start: €100.00; After +10%: €110.00; Then +3%: €113.30</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Slower inflation can</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">still mean higher</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">prices</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hypothetical unchanged basket; not Kosovo</text><text x="24" y="193.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">price data.</text><path d="M 24 227.39999999999998 H 396" stroke="#d9d3c8"/><text x="24" y="252.39999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Start</text><text x="396" y="292.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€100.00</text><rect x="24" y="304.59999999999997" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="304.59999999999997" width="328.332" height="22" rx="3" fill="#a87653"/><text x="24" y="356.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">After +10%</text><text x="396" y="396.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€110.00</text><rect x="24" y="408.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="408.79999999999995" width="361.165" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="460.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Then +3%</text><text x="396" y="500.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€113.30</text><rect x="24" y="513.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="513.0" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="557.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="557.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="585.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hypothetical unchanged basket; not Kosovo</text><text x="24" y="606.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">price data.</text></svg>
