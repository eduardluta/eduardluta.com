<svg xmlns="http://www.w3.org/2000/svg" width="900" height="666" viewBox="0 0 900 666" role="img" aria-labelledby="title desc"><title id="title">Give each part room to develop</title><desc id="desc">Three cards distinguish a commitment expressed through actions, a method open to experimentation and a belief open to new evidence.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Give each part room to develop</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A commitment, a method and a belief have different jobs.</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Commitment</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What value should my</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">actions make visible? Keep</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">returning to it.</text><rect x="460.0" y="197.6" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Method</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">How can I express or</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">practise that value? Try</text><text x="478.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">another approach.</text><rect x="40" y="411.4" width="820" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="443.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Belief</text><text x="58" y="487.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What do I currently think is true? Revisit it when I</text><text x="58" y="519.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">learn more.</text><text x="40" y="601.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Reflection guide · Qualitative distinctions</text></svg>
