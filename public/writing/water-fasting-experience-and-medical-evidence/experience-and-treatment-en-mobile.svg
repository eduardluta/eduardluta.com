<svg xmlns="http://www.w3.org/2000/svg" width="420" height="791" viewBox="0 0 420 791" role="img" aria-labelledby="title desc"><title id="title">A personal experience is not a treatment trial</title><desc id="desc">A personal experience is not a treatment trial. Experience: Calm, focus and reflection are self-reported. Mechanism: Autophagy is cellular recycling, not proof of emotional cleansing. Treatment: Cancer and parasite claims need clinical evidence.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">A personal experience</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">is not a treatment</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">trial</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 206.39999999999998 H 396" stroke="#d9d3c8"/><rect x="24" y="231.39999999999998" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="263.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Experience</text><text x="42" y="300.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Calm, focus and reflection are</text><text x="42" y="325.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">self-reported.</text><rect x="24" y="392.0" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="424.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Mechanism</text><text x="42" y="461.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Autophagy is cellular</text><text x="42" y="486.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">recycling, not proof of</text><text x="42" y="511.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">emotional cleansing.</text><rect x="24" y="577.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="609.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Treatment</text><text x="42" y="647.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Cancer and parasite claims need</text><text x="42" y="672.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">clinical evidence.</text><text x="24" y="746.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
