<svg xmlns="http://www.w3.org/2000/svg" width="900" height="561" viewBox="0 0 900 561" role="img" aria-labelledby="title desc"><title id="title">Katërmbëdhjetë njerëz më shumë nuk u kthyen</title><desc id="desc">Vdekjet në trafik u rritën nga 97 në 2024 në 111 në 2025: 14 persona ose 14,4% më shumë.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Katërmbëdhjetë njerëz më shumë nuk u</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">kthyen</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Persona të vdekur në trafik · Kosovë</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><text x="40" y="248.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">2024</text><text x="860" y="298.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">97 persona</text><rect x="40" y="310.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="310.2" width="716.577" height="22" rx="3" fill="#a87653"/><text x="40" y="362.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">2025</text><text x="860" y="412.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">111 persona</text><rect x="40" y="424.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="424.4" width="820.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="468.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="468.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="496.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Policia e Kosovës, raporti 2025 · vdekje nga të gjitha shkaqet.</text></svg>
