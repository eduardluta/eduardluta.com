<svg xmlns="http://www.w3.org/2000/svg" width="420" height="487" viewBox="0 0 420 487" role="img" aria-labelledby="title desc"><title id="title">Katërmbëdhjetë njerëz më shumë nuk u kthyen</title><desc id="desc">Vdekjet në trafik u rritën nga 97 në 2024 në 111 në 2025: 14 persona ose 14,4% më shumë.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Katërmbëdhjetë njerëz</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">më shumë nuk u kthyen</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Persona të vdekur në trafik · Kosovë</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><text x="24" y="193.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">2024</text><text x="396" y="233.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">97 persona</text><rect x="24" y="245.79999999999998" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="245.79999999999998" width="325.081" height="22" rx="3" fill="#a87653"/><text x="24" y="297.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">2025</text><text x="396" y="337.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">111 persona</text><rect x="24" y="349.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="349.99999999999994" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="393.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="393.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="421.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Policia e Kosovës, raporti 2025 · vdekje</text><text x="24" y="442.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">nga të gjitha shkaqet.</text></svg>
