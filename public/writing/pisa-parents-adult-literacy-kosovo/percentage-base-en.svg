<svg xmlns="http://www.w3.org/2000/svg" width="900" height="625" viewBox="0 0 900 625" role="img" aria-labelledby="title desc"><title id="title">The percentage depends on its base</title><desc id="desc">The percentage depends on its base. Start: €40; After −25%: €30; Then +25%: €37.50</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">The percentage depends on its base</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Invented price example. The second 25% applies to €30.</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><text x="40" y="197.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Start</text><text x="860" y="247.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€40</text><rect x="40" y="259.79999999999995" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="259.79999999999995" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="311.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">After −25%</text><text x="860" y="361.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€30</text><rect x="40" y="373.99999999999994" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="373.99999999999994" width="615.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="425.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Then +25%</text><text x="860" y="476.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">€37.50</text><rect x="40" y="488.19999999999993" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="488.19999999999993" width="768.750" height="22" rx="3" fill="#a87653"/><text x="40" y="532.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="532.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="40" y="560.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Invented price example. The second 25% applies to €30.</text></svg>
