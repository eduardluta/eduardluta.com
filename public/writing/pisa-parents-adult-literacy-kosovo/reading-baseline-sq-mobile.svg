<svg xmlns="http://www.w3.org/2000/svg" width="420" height="508" viewBox="0 0 420 508" role="img" aria-labelledby="title desc"><title id="title">Lexim: të paktën Niveli 2</title><desc id="desc">Lexim: të paktën Niveli 2. Kosova: 16%; Mesatarja OECD: 69%</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Lexim: të paktën Niveli</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">2</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">PISA 2025, nxënësit. Vlerësime të</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rrumbullakosura OECD; jo test prindërish.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kosova</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">16%</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="86.261" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Mesatarja OECD</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">69%</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="414.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15