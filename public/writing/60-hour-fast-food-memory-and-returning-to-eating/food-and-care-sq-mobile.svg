<svg xmlns="http://www.w3.org/2000/svg" width="420" height="690" viewBox="0 0 420 690" role="img" aria-labelledby="title desc"><title id="title">Çfarë po kujtoja</title><desc id="desc">Çfarë po kujtoja. Një person: Gruaja, nëna, dikush që gatuan mirë. Një gjest: Koha dhe mundi për ta përgatitur vaktin. Një takim: Kënaqësia për ta ndarë ushqimin sërish.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Çfarë po kujtoja</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Një person</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gruaja, nëna, dikush që gatuan</text><text x="42" y="250.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">mirë.</text><rect x="24" y="316.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="348.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Një gjest</text><text x="42" y="385.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Koha dhe mundi për ta</text><text x="42" y="410.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përgatitur vaktin.</text><rect x="24" y="477.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="509.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Një takim</text><text x="42" y="546.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kënaqësia për ta ndarë ushqimin</text><text x="42" y="571.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">sërish.</text><text x="24" y="645.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
