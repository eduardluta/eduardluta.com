<svg xmlns="http://www.w3.org/2000/svg" width="420" height="679" viewBox="0 0 420 679" role="img" aria-labelledby="title desc"><title id="title">Pjesa dhe tërësia</title><desc id="desc">Pjesa dhe tërësia. Të bardha: 6 nga 10: 60%; Të zeza: 4 nga 10: 40%; Të bardha: 6 nga 12: 50%; Të zeza: 6 nga 12: 50%</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Pjesa dhe tërësia</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull ilustrues, para dhe pas shtimit</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">të dy palëve të zeza.</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><text x="24" y="176.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Të bardha: 6 nga 10</text><text x="396" y="217.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">60%</text><rect x="24" y="229.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="229.0" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="281.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Të zeza: 4 nga 10</text><text x="396" y="321.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">40%</text><rect x="24" y="333.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="333.2" width="248.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="385.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Të bardha: 6 nga 12</text><text x="396" y="425.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">50%</text><rect x="24" y="437.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="437.4" width="310.000" height="22" rx="3" fill="#a87653"/><text x="24" y="489.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Të zeza: 6 nga 12</text><text x="396" y="529.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">50%</text><rect x="24" y="541.6" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="541.6" width="310.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="585.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="585.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="613.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull ilustrues, para dhe pas shtimit</text><text x="24" y="634.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">të dy palëve të zeza.</text></svg>
