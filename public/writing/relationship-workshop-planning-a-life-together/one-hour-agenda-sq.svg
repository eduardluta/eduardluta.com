<svg xmlns="http://www.w3.org/2000/svg" width="900" height="904" viewBox="0 0 900 904" role="img" aria-labelledby="title desc"><title id="title">Shembull agjende 60-minutëshe</title><desc id="desc">Shembull agjende 60-minutëshe. Çfarë shkoi mirë: 10 min; Shpresat e secilit: 15 min; Kufizimet reale: 15 min; Një hap bashkë: 15 min; Kur kthehemi: 5 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Shembull agjende 60-minutëshe</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ndarje e sugjeruar, jo kohët e workshopit të parë apo formulë e provuar për</text><text x="40" y="159.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">lidhjen.</text><path d="M 40 197.79999999999998 H 860" stroke="#d9d3c8"/><text x="40" y="222.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë shkoi mirë</text><text x="860" y="273.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">10 min</text><rect x="40" y="285.0" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="285.0" width="546.667" height="22" rx="3" fill="#a87653"/><text x="40" y="337.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Shpresat e secilit</text><text x="860" y="387.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">15 min</text><rect x="40" y="399.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="399.2" width="820.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="451.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Kufizimet reale</text><text x="860" y="501.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">15 min</text><rect x="40" y="513.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="513.4" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="565.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Një hap bashkë</text><text x="860" y="615.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">15 min</text><rect x="40" y="627.6" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="627.6" width="820.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="679.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Kur kthehemi</text><text x="860" y="729.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">5 min</text><rect x="40" y="741.8000000000001" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="741.8000000000001" width="273.333" height="22" rx="3" fill="#a87653"/><text x="40" y="785.8000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="785.8000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="813.8000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ndarje e sugjeruar, jo kohët e workshopit të parë apo formulë e provuar për</text><text x="40" y="839.0000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">lidhjen.</text></svg>
