<svg xmlns="http://www.w3.org/2000/svg" width="420" height="821" viewBox="0 0 420 821" role="img" aria-labelledby="title desc"><title id="title">Shembull agjende 60-minutëshe</title><desc id="desc">Shembull agjende 60-minutëshe. Çfarë shkoi mirë: 10 min; Shpresat e secilit: 15 min; Kufizimet reale: 15 min; Një hap bashkë: 15 min; Kur kthehemi: 5 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Shembull agjende</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">60-minutëshe</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ndarje e sugjeruar, jo kohët e workshopit</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">të parë apo formulë e provuar për lidhjen.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë shkoi mirë</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">10 min</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="248.000" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shpresat e secilit</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">15 min</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="422.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kufizimet reale</text><text x="396" y="463.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">15 min</text><rect x="24" y="475.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="475.19999999999993" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="527.1999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një hap bashkë</text><text x="396" y="567.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">15 min</text><rect x="24" y="579.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="579.4" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="631.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kur kthehemi</text><text x="396" y="671.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">5 min</text><rect x="24" y="683.6" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="683.6" width="124.000" height="22" rx="3" fill="#a87653"/><text x="24" y="727.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="727.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="755.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ndarje e sugjeruar, jo kohët e workshopit</text><text x="24" y="776.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">të parë apo formulë e provuar për lidhjen.</text></svg>
