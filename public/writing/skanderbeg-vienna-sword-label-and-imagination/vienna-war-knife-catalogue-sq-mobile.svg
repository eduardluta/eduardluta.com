<svg xmlns="http://www.w3.org/2000/svg" width="420" height="842" viewBox="0 0 420 842" role="img" aria-labelledby="title desc"><title id="title">Katalogu jep përmasat</title><desc id="desc">Katalogu i A 145: gjatësi 150 cm, peshë 3,20 kg, datim rreth 1490–1500 dhe atribuim i mëparshëm Skënderbeut.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Katalogu jep përmasat</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A 145 • Kriegsmesser • Jo matje nga</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">videoja</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><rect x="24" y="176.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="208.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">150 cm</text><text x="42" y="246.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gjatësia e regjistruar: 1,5</text><text x="42" y="271.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">metra.</text><rect x="24" y="337.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="369.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">3,20 kg</text><text x="42" y="406.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Pesha e regjistruar e këtij</text><text x="42" y="431.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">objekti.</text><rect x="24" y="498.0" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="530.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Rreth 1490–1500</text><text x="42" y="567.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Datim i përafërt në katalog.</text><rect x="24" y="633.4" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="665.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Atribuim i mëparshëm</text><text x="42" y="702.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">I lidhur dikur me Skënderbeun.</text><text x="24" y="776.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Regjistri i KHM [2] • Pa përfundim për</text><text x="24" y="797.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">aftësinë luftarake</text></svg>
