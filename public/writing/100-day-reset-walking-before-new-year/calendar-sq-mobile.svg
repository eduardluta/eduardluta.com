<svg xmlns="http://www.w3.org/2000/svg" width="420" height="893" viewBox="0 0 420 893" role="img" aria-labelledby="title desc"><title id="title">Ditët para janarit</title><desc id="desc">Ditët para janarit. 24 shtator: Dita 1: zgjidh një zakon për ta pakësuar dhe një për ta shtuar.. 31 tetor: Dita 38: shiko çfarë ke përsëritur realisht.. 30 nëntor: Dita 68: përshtat atë që e ke të vështirë ta vazhdosh.. 31 dhjetor: Dita 99: shiko prapa para se të zgjedhësh hapin tjetër.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Ditët para janarit</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">24 shtator–31 dhjetor 2026: 99 ditë</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kalendarike</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><rect x="24" y="176.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="208.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">24 shtator</text><text x="42" y="246.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Dita 1: zgjidh një zakon për ta</text><text x="42" y="271.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">pakësuar dhe një për ta shtuar.</text><rect x="24" y="337.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="369.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">31 tetor</text><text x="42" y="406.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Dita 38: shiko çfarë ke</text><text x="42" y="431.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përsëritur realisht.</text><rect x="24" y="498.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="530.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">30 nëntor</text><text x="42" y="567.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Dita 68: përshtat atë që e ke</text><text x="42" y="592.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">të vështirë ta vazhdosh.</text><rect x="24" y="658.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="690.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">31 dhjetor</text><text x="42" y="727.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Dita 99: shiko prapa para se të</text><text x="42" y="753.0000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">zgjedhësh hapin tjetër.</text><text x="24" y="827.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Duke filluar më 23 shtator bëhen 100 ditë,</text><text x="24" y="848.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">me të dyja datat të përfshira.</text></svg>
