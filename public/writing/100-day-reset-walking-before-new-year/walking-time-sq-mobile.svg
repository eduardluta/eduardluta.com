<svg xmlns="http://www.w3.org/2000/svg" width="420" height="655" viewBox="0 0 420 655" role="img" aria-labelledby="title desc"><title id="title">Ecje të shkurtra, kohë që mblidhet</title><desc id="desc">Ecje të shkurtra, kohë që mblidhet. 10 minuta çdo ditë: 16,5 orë; 20 minuta çdo ditë: 33 orë; 30 minuta çdo ditë: 49,5 orë</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Ecje të shkurtra, kohë</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">që mblidhet</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull: minutat ditore × 99 ditë ÷ 60.</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Supozon asnjë ditë të humbur; kohë, jo</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultat i premtuar shëndetësor.</text><path d="M 24 210.6 H 396" stroke="#d9d3c8"/><text x="24" y="235.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">10 minuta çdo ditë</text><text x="396" y="275.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">16,5 orë</text><rect x="24" y="287.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="287.8" width="124.000" height="22" rx="3" fill="#a87653"/><text x="24" y="339.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">20 minuta çdo ditë</text><text x="396" y="380.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">33 orë</text><rect x="24" y="392.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="392.0" width="248.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="444.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">30 minuta çdo ditë</text><text x="396" y="484.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">49,5 orë</text><rect x="24" y="496.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="496.2" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="568.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull: minutat ditore × 99 ditë ÷ 60.</text><text x="24" y="589.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Supozon asnjë ditë të humbur; kohë, jo</text><text x="24" y="610.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultat i premtuar shëndetësor.</text></svg>
