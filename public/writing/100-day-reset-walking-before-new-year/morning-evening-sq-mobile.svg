<svg xmlns="http://www.w3.org/2000/svg" width="420" height="618" viewBox="0 0 420 618" role="img" aria-labelledby="title desc"><title id="title">Dy ecje, dy drejtime të vëmendjes</title><desc id="desc">Dy ecje, dy drejtime të vëmendjes. Mëngjesi: cakto drejtimin: Për çfarë jam mirënjohës? Çfarë ka rëndësi sot? Ku do ta drejtoj vëmendjen?. Mbrëmja: dëgjo dhe reflekto: Çfarë ndodhi? Si ndihem? Çfarë po më tregon trupi? Çfarë mund të bëj ndryshe nesër?</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Dy ecje, dy drejtime të</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">vëmendjes</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Mëngjesi: cakto drejtimin</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Për çfarë jam mirënjohës? Çfarë</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ka rëndësi sot? Ku do ta</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">drejtoj vëmendjen?</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Mbrëmja: dëgjo dhe reflekto</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë ndodhi? Si ndihem? Çfarë</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">po më tregon trupi? Çfarë mund</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">të bëj ndryshe nesër?</text><text x="24" y="573.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
