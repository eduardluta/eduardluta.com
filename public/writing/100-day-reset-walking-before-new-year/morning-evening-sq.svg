<svg xmlns="http://www.w3.org/2000/svg" width="900" height="549" viewBox="0 0 900 549" role="img" aria-labelledby="title desc"><title id="title">Dy ecje, dy drejtime të vëmendjes</title><desc id="desc">Dy ecje, dy drejtime të vëmendjes. Mëngjesi: cakto drejtimin: Për çfarë jam mirënjohës? Çfarë ka rëndësi sot? Ku do ta drejtoj vëmendjen?. Mbrëmja: dëgjo dhe reflekto: Çfarë ndodhi? Si ndihem? Çfarë po më tregon trupi? Çfarë mund të bëj ndryshe nesër?</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Dy ecje, dy drejtime të vëmendjes</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="258.2" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Mëngjesi: cakto drejtimin</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Për çfarë jam mirënjohës?</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë ka rëndësi sot? Ku</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">do ta drejtoj vëmendjen?</text><rect x="460.0" y="197.6" width="400.0" height="258.2" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Mbrëmja: dëgjo dhe</text><text x="478.0" y="261.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">reflekto</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë ndodhi? Si ndihem?</text><text x="478.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë po më tregon trupi?</text><text x="478.0" y="370.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë mund të bëj ndryshe</text><text x="478.0" y="402.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">nesër?</text><text x="40" y="483.79999999999995" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
