<svg xmlns="http://www.w3.org/2000/svg" width="900" height="684" viewBox="0 0 900 684" role="img" aria-labelledby="title desc"><title id="title">Seeing a detail, asking a fair question</title><desc id="desc">Seeing a detail, asking a fair question. Visible in the frame: A bust, its pedestal and the surrounding public space. Needs a closer check: Alignment, condition and any required maintenance. The lasting standard: Care for the place after the ceremony is over.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Seeing a detail, asking a fair</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">question</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Visible in the frame</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">A bust, its pedestal and</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">the surrounding public</text><text x="58.0" y="388.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">space.</text><rect x="460.0" y="248.0" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Needs a closer check</text><text x="478.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Alignment, condition and</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">any required maintenance.</text><rect x="40" y="461.79999999999995" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="493.79999999999995" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">The lasting standard</text><text x="58" y="538.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Care for the place after the ceremony is over.</text><text x="40" y="619.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
