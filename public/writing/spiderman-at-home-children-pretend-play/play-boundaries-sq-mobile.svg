<svg xmlns="http://www.w3.org/2000/svg" width="420" height="813" viewBox="0 0 420 813" role="img" aria-labelledby="title desc"><title id="title">Një marrëveshje e vogël para lojës</title><desc id="desc">Një marrëveshje e vogël para lojës. Fëmija udhëheq: Pyet çfarë roli ke.. Trupi mbetet i sigurt: Ruaje sigurinë dhe liroje hapësirën.. Ndal do të thotë ndal: Kufiri nuk ka nevojë për debat.. Kamera është zgjedhje: Loja ka vlerë edhe pa audiencë.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një marrëveshje e vogël</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">para lojës</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Fëmija udhëheq</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Pyet çfarë roli ke.</text><rect x="24" y="329.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="361.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Trupi mbetet i sigurt</text><text x="42" y="398.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ruaje sigurinë dhe liroje</text><text x="42" y="423.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">hapësirën.</text><rect x="24" y="489.6" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="521.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ndal do të thotë ndal</text><text x="42" y="558.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kufiri nuk ka nevojë për debat.</text><rect x="24" y="625.0" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="657.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kamera është zgjedhje</text><text x="42" y="694.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Loja ka vlerë edhe pa audiencë.</text><text x="24" y="768.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
