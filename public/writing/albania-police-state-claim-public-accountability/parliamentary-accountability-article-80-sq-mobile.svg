<svg xmlns="http://www.w3.org/2000/svg" width="420" height="799" viewBox="0 0 420 799" role="img" aria-labelledby="title desc"><title id="title">Dy rrugë që i parashikon Kushtetuta</title><desc id="desc">Dy rrugë kushtetuese për shpjegime dhe pyetja nëse u përdorën.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Dy rrugë që i</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">parashikon Kushtetuta</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Neni 80 • Kontrolli parlamentar</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pyetje dhe interpelanca</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kryeministri e ministrat e</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">tjerë u përgjigjen deputetëve</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">brenda tri javëve.</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kërkesa të komisioneve</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Drejtuesit e institucioneve</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">japin shpjegime e informacion</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">sa lejon ligji.</text><rect x="24" y="565.1999999999999" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="597.1999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pyetja që duhet kontrolluar</text><text x="42" y="634.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A u bë kërkesë dhe ku është</text><text x="42" y="659.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përgjigjja e dokumentuar?</text><text x="24" y="733.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Kushtetuta, neni 80 • Jo përfundim për</text><text x="24" y="754.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rastin</text></svg>
