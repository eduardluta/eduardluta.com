<svg xmlns="http://www.w3.org/2000/svg" width="900" height="751" viewBox="0 0 900 751" role="img" aria-labelledby="title desc"><title id="title">Six ways to practise showing up</title><desc id="desc">Six ways to practise showing up. Higher Self: Reflect on what matters. Body: Make room for movement. Breathwork: Pause and pay attention. Meditation: Return to the present. Affirmations: Give an intention a voice. Create: Make something of your own.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Six ways to practise showing up</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">The current Be The One product structure</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Higher Self</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Reflect on what matters.</text><rect x="460.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Body</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Make room for movement.</text><rect x="40.0" y="347.0" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="379.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Breathwork</text><text x="58.0" y="423.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Pause and pay attention.</text><rect x="460.0" y="347.0" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="379.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Meditation</text><text x="478.0" y="423.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Return to the present.</text><rect x="40.0" y="496.4" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="528.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Affirmations</text><text x="58.0" y="572.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Give an intention a voice.</text><rect x="460.0" y="496.4" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="528.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Create</text><text x="478.0" y="572.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Make something of your</text><text x="478.0" y="604.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">own.</text><text x="40" y="686.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Source: bethe.one · Product may change during beta.</text></svg>
