<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1080" viewBox="0 0 420 1080" role="img" aria-labelledby="title desc"><title id="title">Gjashtë mënyra për t’u angazhuar</title><desc id="desc">Gjashtë mënyra për t’u angazhuar. Higher Self: Reflekto për atë që ka rëndësi. Body: Krijo hapësirë për lëvizje. Breathwork: Ndalu dhe kushto vëmendje. Meditation: Ktheje vëmendjen te e tashmja. Affirmations: Jepi zë një qëllimi. Create: Krijo diçka tënden.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Gjashtë mënyra për t’u</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">angazhuar</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Struktura aktuale e produktit Be The One</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Higher Self</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Reflekto për atë që ka rëndësi.</text><rect x="24" y="329.0" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="361.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Body</text><text x="42" y="398.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Krijo hapësirë për lëvizje.</text><rect x="24" y="464.4" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="496.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Breathwork</text><text x="42" y="533.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ndalu dhe kushto vëmendje.</text><rect x="24" y="599.8" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="631.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Meditation</text><text x="42" y="669.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ktheje vëmendjen te e tashmja.</text><rect x="24" y="735.1999999999999" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="767.1999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Affirmations</text><text x="42" y="804.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Jepi zë një qëllimi.</text><rect x="24" y="870.5999999999999" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="902.5999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Create</text><text x="42" y="939.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Krijo diçka tënden.</text><text x="24" y="1013.9999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Burimi: bethe.one · Produkti mund të</text><text x="24" y="1035.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">ndryshojë gjatë fazës beta.</text></svg>
