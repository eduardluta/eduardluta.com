<svg xmlns="http://www.w3.org/2000/svg" width="900" height="516" viewBox="0 0 900 516" role="img" aria-labelledby="title desc"><title id="title">Two things can belong in the same day</title><desc id="desc">Two things can belong in the same day. Remember the person: A memory can have a place without filling every moment. Care for the life still here: One ordinary action can coexist with missing someone.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Two things can belong in the same day</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Returning to life does not require forgetting</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="226.0" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Remember the person</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">A memory can have a place</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">without filling every</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">moment.</text><rect x="460.0" y="197.6" width="400.0" height="226.0" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Care for the life still</text><text x="478.0" y="261.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">here</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">One ordinary action can</text><text x="478.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">coexist with missing</text><text x="478.0" y="370.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">someone.</text><text x="40" y="451.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
