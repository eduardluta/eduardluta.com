<svg xmlns="http://www.w3.org/2000/svg" width="900" height="567" viewBox="0 0 900 567" role="img" aria-labelledby="title desc"><title id="title">Dy gjëra mund të kenë vend në të njëjtën ditë</title><desc id="desc">Dy gjëra mund të kenë vend në të njëjtën ditë. Kujto personin: Një kujtim mund të ketë vend pa e mbushur çdo çast. Kujdesu për jetën që vazhdon: Një veprim i zakonshëm mund të bashkëjetojë me mallin.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Dy gjëra mund të kenë vend në të</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">njëjtën ditë</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kthimi në jetë nuk kërkon harresë</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="226.0" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Kujto personin</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Një kujtim mund të ketë</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">vend pa e mbushur çdo</text><text x="58.0" y="388.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">çast.</text><rect x="460.0" y="248.0" width="400.0" height="226.0" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Kujdesu për jetën që</text><text x="478.0" y="312.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">vazhdon</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Një veprim i zakonshëm</text><text x="478.0" y="388.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">mund të bashkëjetojë me</text><text x="478.0" y="420.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">mallin.</text><text x="40" y="502.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
