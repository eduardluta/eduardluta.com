<svg xmlns="http://www.w3.org/2000/svg" width="420" height="665" viewBox="0 0 420 665" role="img" aria-labelledby="title desc"><title id="title">Një gjë në një kohë</title><desc id="desc">Tri karta sugjerojnë të shikosh rrugën, të ndalesh në një vend të lirë për t’u përgjigjur dhe të largosh telefonin e të shikosh përreth para se të vazhdosh.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një gjë në një kohë</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një sugjerim i vogël për mesazhin tjetër</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kur ecën</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Mbaji sytë nga rruga.</text><rect x="24" y="291.20000000000005" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="323.20000000000005" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kur përgjigjesh</text><text x="42" y="360.40000000000003" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ndalu në një vend të lirë për</text><text x="42" y="385.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">të shkruar.</text><rect x="24" y="451.80000000000007" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="483.80000000000007" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kur vazhdon</text><text x="42" y="521.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Largoje telefonin; shiko</text><text x="42" y="546.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përreth.</text><text x="24" y="620.4000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Zakon i sugjeruar • Pa rezultate të matura</text></svg>
