<svg xmlns="http://www.w3.org/2000/svg" width="420" height="766" viewBox="0 0 420 766" role="img" aria-labelledby="title desc"><title id="title">A mund të çojë përgjigjja te një provë?</title><desc id="desc">A mund të çojë përgjigjja te një provë. Hedhje poshtë: Vendim përfundimtar pa diçka për shqyrtim. Kritikë e dobishme: Shqetësim konkret që mund ta hulumtosh. Hapi yt: Kontrolloje shqetësimin para zotimit tjetër.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">A mund të çojë</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">përgjigjja te një</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">provë?</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 206.39999999999998 H 396" stroke="#d9d3c8"/><rect x="24" y="231.39999999999998" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="263.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hedhje poshtë</text><text x="42" y="300.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vendim përfundimtar pa diçka</text><text x="42" y="325.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">për shqyrtim.</text><rect x="24" y="392.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="424.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kritikë e dobishme</text><text x="42" y="461.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shqetësim konkret që mund ta</text><text x="42" y="486.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">hulumtosh.</text><rect x="24" y="552.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="584.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hapi yt</text><text x="42" y="621.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kontrolloje shqetësimin para</text><text x="42" y="647.0000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">zotimit tjetër.</text><text x="24" y="721.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
