<svg xmlns="http://www.w3.org/2000/svg" width="900" height="652" viewBox="0 0 900 652" role="img" aria-labelledby="title desc"><title id="title">A mund të çojë përgjigjja te një provë?</title><desc id="desc">A mund të çojë përgjigjja te një provë. Hedhje poshtë: Vendim përfundimtar pa diçka për shqyrtim. Kritikë e dobishme: Shqetësim konkret që mund ta hulumtosh. Hapi yt: Kontrolloje shqetësimin para zotimit tjetër.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">A mund të çojë përgjigjja te një</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">provë?</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Hedhje poshtë</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Vendim përfundimtar pa</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">diçka për shqyrtim.</text><rect x="460.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Kritikë e dobishme</text><text x="478.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Shqetësim konkret që mund</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">ta hulumtosh.</text><rect x="40" y="429.59999999999997" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="461.59999999999997" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Hapi yt</text><text x="58" y="505.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Kontrolloje shqetësimin para zotimit tjetër.</text><text x="40" y="587.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
