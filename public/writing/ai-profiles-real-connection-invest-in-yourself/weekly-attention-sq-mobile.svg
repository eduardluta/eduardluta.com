<svg xmlns="http://www.w3.org/2000/svg" width="420" height="533" viewBox="0 0 420 533" role="img" aria-labelledby="title desc"><title id="title">Një javë me 210 minuta</title><desc id="desc">Një javë me 210 minuta. Mësim: 20 × 5: 100 min; Biseda: 30 × 2: 60 min; Reflektim: 10 × 5: 50 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një javë me 210 minuta</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Plan ilustrues, jo ndërhyrje e testuar.</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><text x="24" y="155.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Mësim: 20 × 5</text><text x="396" y="196.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">100 min</text><rect x="24" y="208.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="208.0" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="260.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Biseda: 30 × 2</text><text x="396" y="300.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">60 min</text><rect x="24" y="312.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="312.2" width="223.200" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="364.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Reflektim: 10 × 5</text><text x="396" y="404.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">50 min</text><rect x="24" y="416.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="416.4" width="186.000" height="22" rx="3" fill="#a87653"/><text x="24" y="460.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="460.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="488.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Plan ilustrues, jo ndërhyrje e testuar.</text></svg>
