<svg xmlns="http://www.w3.org/2000/svg" width="420" height="575" viewBox="0 0 420 575" role="img" aria-labelledby="title desc"><title id="title">A 210-minute week</title><desc id="desc">A 210-minute week. Learning: 20 × 5: 100 min; Connection: 30 × 2: 60 min; Reflection: 10 × 5: 50 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">A 210-minute week</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Illustrative plan, not a tested</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">intervention.</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><text x="24" y="176.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Learning: 20 × 5</text><text x="396" y="217.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">100 min</text><rect x="24" y="229.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="229.0" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="281.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Connection: 30 × 2</text><text x="396" y="321.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">60 min</text><rect x="24" y="333.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="333.2" width="223.200" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="385.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Reflection: 10 × 5</text><text x="396" y="425.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">50 min</text><rect x="24" y="437.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="437.4" width="186.000" height="22" rx="3" fill="#a87653"/><text x="24" y="481.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="481.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="509.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Illustrative plan, not a tested</text><text x="24" y="530.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">intervention.</text></svg>
