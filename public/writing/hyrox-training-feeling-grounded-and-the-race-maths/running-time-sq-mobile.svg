<svg xmlns="http://www.w3.org/2000/svg" width="420" height="551" viewBox="0 0 420 551" role="img" aria-labelledby="title desc"><title id="title">HYROX: vetëm koha e vrapimit</title><desc id="desc">HYROX: vetëm koha e vrapimit. 8 km me 5 min/km: 40 minuta; 8 km me 6 min/km: 48 minuta</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">HYROX: vetëm koha e</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">vrapimit</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ritme konstante hipotetike. Pa stacione e</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kalime. Jo parashikim i kohës</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">përfundimtare.</text><path d="M 24 210.6 H 396" stroke="#d9d3c8"/><text x="24" y="235.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">8 km me 5 min/km</text><text x="396" y="275.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">40 minuta</text><rect x="24" y="287.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="287.8" width="310.000" height="22" rx="3" fill="#a87653"/><text x="24" y="339.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">8 km me 6 min/km</text><text x="396" y="380.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">48 minuta</text><rect x="24" y="392.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="392.0" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="436.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="436.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="464.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ritme konstante hipotetike. Pa stacione e</text><text x="24" y="485.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kalime. Jo parashikim i kohës</text><text x="24" y="506.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">përfundimtare.</text></svg>
