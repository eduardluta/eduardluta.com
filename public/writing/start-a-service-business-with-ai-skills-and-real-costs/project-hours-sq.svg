<svg xmlns="http://www.w3.org/2000/svg" width="900" height="612" viewBox="0 0 900 612" role="img" aria-labelledby="title desc"><title id="title">Drafti më i shpejtë është vetëm një pjesë</title><desc id="desc">Drafti më i shpejtë është vetëm një pjesë. Mënyra fillestare: 6 orë gjithsej; Shembulli me AI: 5 orë gjithsej</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Drafti më i shpejtë është vetëm një</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">pjesë</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Projekt hipotetik: prodhimi plus kontrolli. I njëjti çmim €200; kursim i</text><text x="40" y="210.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">supozuar, jo i matur apo i garantuar.</text><path d="M 40 248.2 H 860" stroke="#d9d3c8"/><text x="40" y="273.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Mënyra fillestare</text><text x="860" y="323.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">6 orë gjithsej</text><rect x="40" y="335.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="335.4" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="387.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Shembulli me AI</text><text x="860" y="437.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">5 orë gjithsej</text><rect x="40" y="449.59999999999997" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="449.59999999999997" width="683.333" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="493.59999999999997" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="493.59999999999997" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="521.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Projekt hipotetik: prodhimi plus kontrolli. I njëjti çmim €200; kursim i</text><text x="40" y="546.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">supozuar, jo i matur apo i garantuar.</text></svg>
