<svg xmlns="http://www.w3.org/2000/svg" width="420" height="575" viewBox="0 0 420 575" role="img" aria-labelledby="title desc"><title id="title">5,3 km: koha në ecje</title><desc id="desc">5,3 km: koha në ecje. Me 3 km/orë: 106 min; Me 4 km/orë: 79,5 min; Me 5 km/orë: 63,6 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">5,3 km: koha në ecje</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Ritme ilustruese; pa ndalesa, kalime apo</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">devijime.</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><text x="24" y="176.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Me 3 km/orë</text><text x="396" y="217.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">106 min</text><rect x="24" y="229.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="229.0" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="281.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Me 4 km/orë</text><text x="396" y="321.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">79,5 min</text><rect x="24" y="333.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="333.2" width="279.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="385.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Me 5 km/orë</text><text x="396" y="425.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">63,6 min</text><rect x="24" y="437.4" width