<svg xmlns="http://www.w3.org/2000/svg" width="420" height="749" viewBox="0 0 420 749" role="img" aria-labelledby="title desc"><title id="title">One voice, three settings</title><desc id="desc">One voice in three settings: check understanding with a person, clarity on camera, and relevance in a sales conversation.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">One voice, three</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">settings</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Different questions for the same</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">explanation</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><rect x="24" y="214.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="246.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">With someone</text><text x="42" y="283.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Can they tell you what they</text><text x="42" y="309.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">understood?</text><rect x="24" y="375.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="407.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">On camera</text><text x="42" y="444.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Can you make the point without</text><text x="42" y="469.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">hiding behind a script?</text><rect x="24" y="535.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="567.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">In a sales conversation</text><text x="42" y="605.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Does the offer address this</text><text x="42" y="630.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">person’s actual problem?</text><text x="24" y="704.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide • No measured outcomes</text></svg>
