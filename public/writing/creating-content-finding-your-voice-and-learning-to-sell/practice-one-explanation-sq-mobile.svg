<svg xmlns="http://www.w3.org/2000/svg" width="420" height="931" viewBox="0 0 420 931" role="img" aria-labelledby="title desc"><title id="title">Ushtro një shpjegim të dobishëm</title><desc id="desc">Ushtro shpjegimin: zgjidh një pyetje të dobishme, jep shembull, pyet çfarë kuptoi dëgjuesi dhe ndrysho një pjesë.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Ushtro një shpjegim të</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">dobishëm</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një ushtrim që fillon me një pyetje</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">konkrete</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><rect x="24" y="214.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="246.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Zgjidh pyetjen</text><text x="42" y="283.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë duhet të dijë dikush i</text><text x="42" y="309.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">interesuar për punën tënde?</text><rect x="24" y="375.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="407.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Jep një shembull</text><text x="42" y="444.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Trego si funksionon në një</text><text x="42" y="469.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">situatë që e njeh.</text><rect x="24" y="535.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="567.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pyet çfarë u kuptua</text><text x="42" y="605.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Lëre dëgjuesin ta përshkruajë</text><text x="42" y="630.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">atë që mori.</text><rect x="24" y="696.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="728.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ndrysho një pjesë</text><text x="42" y="765.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Përdore përgjigjen për ta</text><text x="42" y="790.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">udhëzuar provën tjetër.</text><text x="24" y="865.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Pyetje për praktikë • Pa parashikim</text><text x="24" y="886.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">shitjesh</text></svg>
