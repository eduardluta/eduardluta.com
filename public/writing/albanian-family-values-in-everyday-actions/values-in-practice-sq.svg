<svg xmlns="http://www.w3.org/2000/svg" width="900" height="601" viewBox="0 0 900 601" role="img" aria-labelledby="title desc"><title id="title">Le ta përshkruajë vlera një veprim</title><desc id="desc">Le ta përshkruajë vlera një veprim. Respekti: Si flasim kur nuk pajtohemi?. Përgjegjësia: Kush e bën punën që themi se ka rëndësi?. Kujdesi: A ndihen të përfshirë njerëzit pranë nesh?.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Le ta përshkruajë vlera një veprim</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Respekti</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Si flasim kur nuk</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">pajtohemi?</text><rect x="460.0" y="197.6" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Përgjegjësia</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Kush e bën punën që themi</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">se ka rëndësi?</text><rect x="40" y="379.19999999999993" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="411.19999999999993" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Kujdesi</text><text x="58" y="455.3999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">A ndihen të përfshirë njerëzit pranë nesh?</text><text x="40" y="536.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
