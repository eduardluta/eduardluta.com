<svg xmlns="http://www.w3.org/2000/svg" width="900" height="698" viewBox="0 0 900 698" role="img" aria-labelledby="title desc"><title id="title">Give a good conversation a next step</title><desc id="desc">Give a good conversation a next step. Ask for the story: What happened? What changed? Let the person tell it in their own words.. Listen for the detail: An example tells you more than a polite general answer.. Close with care: Thank them. If you agree to stay in touch, make that next step clear.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Give a good conversation a next step</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="225.99999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Ask for the story</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What happened? What</text><text x="58.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">changed? Let the person</text><text x="58.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">tell it in their own</text><text x="58.0" y="370.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">words.</text><rect x="460.0" y="197.6" width="400.0" height="225.99999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Listen for the detail</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">An example tells you more</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">than a polite general</text><text x="478.0" y="338.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">answer.</text><rect x="40" y="443.59999999999997" width="820" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="475.59999999999997" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Close with care</text><text x="58" y="519.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Thank them. If you agree to stay in touch, make that next</text><text x="58" y="552.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">step clear.</text><text x="40" y="633.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
