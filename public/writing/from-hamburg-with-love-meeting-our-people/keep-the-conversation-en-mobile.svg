<svg xmlns="http://www.w3.org/2000/svg" width="420" height="816" viewBox="0 0 420 816" role="img" aria-labelledby="title desc"><title id="title">Give a good conversation a next step</title><desc id="desc">Give a good conversation a next step. Ask for the story: What happened? What changed? Let the person tell it in their own words.. Listen for the detail: An example tells you more than a polite general answer.. Close with care: Thank them. If you agree to stay in touch, make that next step clear.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Give a good</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">conversation a next</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">step</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 206.39999999999998 H 396" stroke="#d9d3c8"/><rect x="24" y="231.39999999999998" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="263.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ask for the story</text><text x="42" y="300.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">What happened? What changed?</text><text x="42" y="325.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Let the person tell it in their</text><text x="42" y="350.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">own words.</text><rect x="24" y="417.19999999999993" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="449.19999999999993" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Listen for the detail</text><text x="42" y="486.3999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">An example tells you more than</text><text x="42" y="511.5999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">a polite general answer.</text><rect x="24" y="577.8" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="609.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Close with care</text><text x="42" y="647.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Thank them. If you agree to</text><text x="42" y="672.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">stay in touch, make that next</text><text x="42" y="697.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">step clear.</text><text x="24" y="771.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
