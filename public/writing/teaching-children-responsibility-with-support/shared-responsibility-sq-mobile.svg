<svg xmlns="http://www.w3.org/2000/svg" width="420" height="639" viewBox="0 0 420 639" role="img" aria-labelledby="title desc"><title id="title">Role të ndryshme, praktikë bashkë</title><desc id="desc">Fëmija ushtron detyra të përballueshme; i rrituri mban sigurinë, mbështetjen dhe vendimet e veta.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Role të ndryshme,</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">praktikë bashkë</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Përgjegjësi në masën e përshtatshme</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pjesa e fëmijës</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Provo një detyrë të</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">përballueshme, fol dhe ndihmo</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">në korrigjim.</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Pjesa e të rriturit</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Siguro mbrojtje, shpjegim e</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ndihmë; mbaji vendimet e të</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">rriturit.</text><text x="24" y="573.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Kornizë e artikullit · detyrat varen nga</text><text x="24" y="594.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">fëmija konkret.</text></svg>
