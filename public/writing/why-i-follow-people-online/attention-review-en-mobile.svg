<svg xmlns="http://www.w3.org/2000/svg" width="420" height="753" viewBox="0 0 420 753" role="img" aria-labelledby="title desc"><title id="title">A small review of your feed</title><desc id="desc">A small review of your feed. Choose ten: Start with accounts you see regularly.. Name the value: Write one sentence about what stays with you.. Make a choice: Keep, reduce or unfollow according to your own preference.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">A small review of your</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">feed</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Choose ten</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Start with accounts you see</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">regularly.</text><rect x="24" y="354.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="386.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Name the value</text><text x="42" y="423.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Write one sentence about what</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">stays with you.</text><rect x="24" y="514.8" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="546.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Make a choice</text><text x="42" y="584.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Keep, reduce or unfollow</text><text x="42" y="609.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">according to your own</text><text x="42" y="634.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">preference.</text><text x="24" y="708.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
