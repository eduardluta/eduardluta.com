<svg xmlns="http://www.w3.org/2000/svg" width="420" height="717" viewBox="0 0 420 717" role="img" aria-labelledby="title desc"><title id="title">Një provë imagjinare: numëro njerëzit</title><desc id="desc">Një provë imagjinare: numëro njerëzit. Të kontaktuar: 50 persona; U përgjigjën: 20 persona; E provuan: 5 persona; Blenë: 2 persona</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një provë imagjinare:</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">numëro njerëzit</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull i sajuar. Grupe të përfshira, jo</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultate biznesi.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Të kontaktuar</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">50 persona</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">U përgjigjën</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">20 persona</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="148.800" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="422.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">E provuan</text><text x="396" y="463.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">5 persona</text><rect x="24" y="475.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="475.19999999999993" width="37.200" height="22" rx="3" fill="#a87653"/><text x="24" y="527.1999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Blenë</text><text x="396" y="567.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">2 persona</text><rect x="24" y="579.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="579.4" width="14.880" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="623.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="623.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="651.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull i sajuar. Grupe të përfshira, jo</text><text x="24" y="672.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">rezultate biznesi.</text></svg>
