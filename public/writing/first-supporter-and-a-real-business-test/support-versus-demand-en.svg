<svg xmlns="http://www.w3.org/2000/svg" width="900" height="652" viewBox="0 0 900 652" role="img" aria-labelledby="title desc"><title id="title">Support and demand answer different questions</title><desc id="desc">Support and demand answer different questions. Supporter: Will someone help you think and keep working?. Potential user: Does this solve a problem they actually have?. Customer evidence: Will they use it, pay and return? Check separately.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Support and demand answer different</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">questions</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Supporter</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Will someone help you</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">think and keep working?</text><rect x="460.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Potential user</text><text x="478.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Does this solve a problem</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">they actually have?</text><rect x="40" y="429.59999999999997" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="461.59999999999997" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Customer evidence</text><text x="58" y="505.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Will they use it, pay and return? Check separately.</text><text x="40" y="587.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
