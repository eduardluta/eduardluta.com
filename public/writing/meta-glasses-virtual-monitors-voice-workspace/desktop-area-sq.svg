<svg xmlns="http://www.w3.org/2000/svg" width="900" height="726" viewBox="0 0 900 726" role="img" aria-labelledby="title desc"><title id="title">Më shumë hapësirë për dritare të hapura</title><desc id="desc">Më shumë hapësirë për dritare të hapura. 1 ekran virtual: 2,07 milionë pikselë; 2 ekrane virtuale: 4,15 milionë pikselë; 3 ekrane virtuale: 6,22 milionë pikselë</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Më shumë hapësirë për dritare të</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">hapura</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembull: çdo ekran pune është 1920 × 1080. Hapësirë logjike, jo rezolucion i</text><text x="40" y="210.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">pajisjes apo matje produktiviteti.</text><path d="M 40 248.2 H 860" stroke="#d9d3c8"/><text x="40" y="273.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">1 ekran virtual</text><text x="860" y="323.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">2,07 milionë pikselë</text><rect x="40" y="335.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="335.4" width="273.333" height="22" rx="3" fill="#a87653"/><text x="40" y="387.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">2 ekrane virtuale</text><text x="860" y="437.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">4,15 milionë pikselë</text><rect x="40" y="449.59999999999997" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="449.59999999999997" width="546.667" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="501.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">3 ekrane virtuale</text><text x="860" y="551.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">6,22 milionë pikselë</text><rect x="40" y="563.8" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="563.8" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="607.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="607.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="635.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembull: çdo ekran pune është 1920 × 1080. Hapësirë logjike, jo rezolucion i</text><text x="40" y="661.0" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">pajisjes apo matje produktiviteti.</text></svg>
