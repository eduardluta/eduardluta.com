<svg xmlns="http://www.w3.org/2000/svg" width="420" height="770" viewBox="0 0 420 770" role="img" aria-labelledby="title desc"><title id="title">Bashkohu në lojën e vogël</title><desc id="desc">Tri ftesa për një shkëmbim me lojë: vëre interesin e fëmijës, përgjigju dhe lër hapësirë për lëvizjen tjetër.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Bashkohu në lojën e</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">vogël</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull i përditshëm, jo provim</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">prindërimi</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><rect x="24" y="214.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="246.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Vëre</text><text x="42" y="283.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë ia ka tërhequr vëmendjen</text><text x="42" y="309.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">fëmijës?</text><rect x="24" y="375.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="407.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Përgjigju</text><text x="42" y="444.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Emërtoje, buzëqesh ose bashkohu</text><text x="42" y="469.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">në lojë.</text><rect x="24" y="535.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="567.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Lër hapësirë</text><text x="42" y="605.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Prit lëvizjen tjetër; ndiqe kur</text><text x="42" y="630.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">kalon te diçka tjetër.</text><text x="24" y="704.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Shembull redaksional mbështetur te</text><text x="24" y="725.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">UNICEF-i dhe Harvardi</text></svg>
