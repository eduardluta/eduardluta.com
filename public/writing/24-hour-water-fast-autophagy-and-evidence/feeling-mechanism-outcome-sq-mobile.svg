<svg xmlns="http://www.w3.org/2000/svg" width="420" height="678" viewBox="0 0 420 678" role="img" aria-labelledby="title desc"><title id="title">Mos i bashko në një pretendim</title><desc id="desc">Mos i bashko në një pretendim. Ndjesia: Raportoj energji dhe qartësi. Mekanizmi: Procesi qelizor kërkon matje. Rezultati: Trajtimi kërkon prova për dobinë dhe dëmin.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Mos i bashko në një</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">pretendim</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ndjesia</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Raportoj energji dhe qartësi.</text><rect x="24" y="329.0" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="361.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Mekanizmi</text><text x="42" y="398.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Procesi qelizor kërkon matje.</text><rect x="24" y="464.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="496.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Rezultati</text><text x="42" y="533.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Trajtimi kërkon prova për</text><text x="42" y="558.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">dobinë dhe dëmin.</text><text x="24" y="633.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
