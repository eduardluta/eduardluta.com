<svg xmlns="http://www.w3.org/2000/svg" width="420" height="551" viewBox="0 0 420 551" role="img" aria-labelledby="title desc"><title id="title">Mbaji të dyja</title><desc id="desc">Loja dhe përgjegjësia mund të bashkëjetojnë: kureshtja bashkë me zotimet dhe korrigjimin.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Mbaji të dyja</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Dallim personal, jo test klinik</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hapësirë për lojë</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kureshtje, të qeshura, prova pa</text><text x="42" y="250.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">kërkuar përsosmëri.</text><rect x="24" y="316.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="348.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Hapësirë për përgjegjësi</text><text x="42" y="385.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Mbaji zotimet, shihi pasojat,</text><text x="42" y="410.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">korrigjo gabimet.</text><text x="24" y="485.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Reflektim i artikullit · këto mund të</text><text x="24" y="506.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">bashkëjetojnë.</text></svg>
