<svg xmlns="http://www.w3.org/2000/svg" width="900" height="716" viewBox="0 0 900 716" role="img" aria-labelledby="title desc"><title id="title">Çka duhet të ruajë një krahasim i drejtë</title><desc id="desc">Çka duhet të ruajë një krahasim i drejtë. Personin: Përgjegjësinë individuale, jo kombësinë.. Çështjen: Veprat dhe faktet e provuara në atë proces.. Fazën: Gjykimin, apelin dhe vendimet e mëvonshme.. Arsyet: Rrethanat rënduese e lehtësuese, jo vetëm vitet.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Çka duhet të ruajë një krahasim i</text><text x="40" y="126.4" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">drejtë</text><text x="40" y="184.8" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 223.0 H 860" stroke="#d9d3c8"/><rect x="40.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Personin</text><text x="58.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Përgjegjësinë individuale,</text><text x="58.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">jo kombësinë.</text><rect x="460.0" y="248.0" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="280.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Çështjen</text><text x="478.0" y="324.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Veprat dhe faktet e</text><text x="478.0" y="356.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">provuara në atë proces.</text><rect x="40.0" y="429.59999999999997" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="461.59999999999997" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Fazën</text><text x="58.0" y="505.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Gjykimin, apelin dhe</text><text x="58.0" y="538.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">vendimet e mëvonshme.</text><rect x="460.0" y="429.59999999999997" width="400.0" height="193.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="461.59999999999997" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Arsyet</text><text x="478.0" y="505.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Rrethanat rënduese e</text><text x="478.0" y="538.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">lehtësuese, jo vetëm</text><text x="478.0" y="570.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">vitet.</text><text x="40" y="651.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
