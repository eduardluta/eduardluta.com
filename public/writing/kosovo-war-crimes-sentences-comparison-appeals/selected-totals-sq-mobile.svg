<svg xmlns="http://www.w3.org/2000/svg" width="420" height="559" viewBox="0 0 420 559" role="img" aria-labelledby="title desc"><title id="title">Shumat e dënimeve të përzgjedhura</title><desc id="desc">Shumat e dënimeve të përzgjedhura. Gjashtë persona të përzgjedhur, TPNJ: 107 vjet; Gjashtë persona të përzgjedhur, DHSK: 109 vjet</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Shumat e dënimeve të</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">përzgjedhura</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Faza të ndryshme procedurale. Shumat nuk</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">matin proporcionalitetin juridik.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gjashtë persona të përzgjedhur,</text><text x="24" y="239.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">TPNJ</text><text x="396" y="280.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">107 vjet</text><rect x="24" y="292.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="292.0" width="365.174" height="22" rx="3" fill="#a87653"/><text x="24" y="344.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gjashtë persona të përzgjedhur,</text><text x="24" y="369.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">DHSK</text><text x="396" y="409.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">109 vjet</text><rect x="24" y="421.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="421.4" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="465.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="465.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="493.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Faza të ndryshme procedurale. Shumat nuk</text><text x="24" y="514.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">matin proporcionalitetin juridik.</text></svg>
