<svg xmlns="http://www.w3.org/2000/svg" width="420" height="686" viewBox="0 0 420 686" role="img" aria-labelledby="title desc"><title id="title">Kontrolloje lidhjen</title><desc id="desc">Tri karta kontrollojnë pamjen, gjeografinë dhe paraardhësit kundrejt pretendimit të shpikjes.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Kontrolloje lidhjen</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një hollësi e vërtetë nuk provon çdo</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">përfundim që i bashkëngjitet.</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><rect x="24" y="176.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="208.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Duket e pazakontë</text><text x="42" y="246.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vetëm pamja nuk përcakton</text><text x="42" y="271.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">origjinën.</text><rect x="24" y="337.4" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="369.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Jeton në Kinë</text><text x="42" y="406.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Gjeografia nuk provon shpikje.</text><rect x="24" y="472.79999999999995" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="504.79999999999995" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ka paraardhës të lashtë</text><text x="42" y="542.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Fosilet kundërshtojnë historinë</text><text x="42" y="567.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">e një shpikjeje të re.</text><text x="24" y="641.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Arsyetim redaksional · burimet [2–3]</text></svg>
