<svg xmlns="http://www.w3.org/2000/svg" width="420" height="821" viewBox="0 0 420 821" role="img" aria-labelledby="title desc"><title id="title">Objekti dhe dokumentimi</title><desc id="desc">Objekti dhe dokumentimi. 1468: Vdes Skënderbeu.. rreth 1450–1500: Datimi i mundshëm që jep muzeu.. 1593: Përkrenarja shënohet në inventarin e Ambrasit.. 125 vjet: Nga vdekja te ky shënim në inventar.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Objekti dhe dokumentimi</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Dokumentimi i KHM-së; atribuimi dhe datat.</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">1468</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vdes Skënderbeu.</text><rect x="24" y="291.20000000000005" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="323.20000000000005" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">rreth 1450–1500</text><text x="42" y="360.40000000000003" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Datimi i mundshëm që jep muzeu.</text><rect x="24" y="426.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="458.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">1593</text><text x="42" y="495.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Përkrenarja shënohet në</text><text x="42" y="521.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">inventarin e Ambrasit.</text><rect x="24" y="587.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="619.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">125 vjet</text><text x="42" y="656.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Nga vdekja te ky shënim në</text><text x="42" y="681.6000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">inventar.</text><text x="24" y="755.8000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Intervali dokumentar: 1593 − 1468 = 125</text><text x="24" y="776.8000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">vjet.</text></svg>
