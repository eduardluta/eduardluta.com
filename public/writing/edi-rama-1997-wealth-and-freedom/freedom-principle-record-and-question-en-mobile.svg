<svg xmlns="http://www.w3.org/2000/svg" width="420" height="770" viewBox="0 0 420 770" role="img" aria-labelledby="title desc"><title id="title">Keep three statements distinct</title><desc id="desc">Three cards distinguish the clip’s principle, independent historical context and an editorial question for the present.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Keep three statements</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">distinct</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A principle, a record and a present</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">question</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><rect x="24" y="214.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="246.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The clip</text><text x="42" y="283.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Wealth does not remove the need</text><text x="42" y="309.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">for freedom.</text><rect x="24" y="375.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="407.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The historical report</text><text x="42" y="444.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Independent context for the</text><text x="42" y="469.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1996 elections.</text><rect x="24" y="535.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="567.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The question today</text><text x="42" y="605.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Apply the same principle to</text><text x="42" y="630.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">whoever governs.</text><text x="24" y="704.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Source reading • Historical scope in note</text><text x="24" y="725.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3</text></svg>
