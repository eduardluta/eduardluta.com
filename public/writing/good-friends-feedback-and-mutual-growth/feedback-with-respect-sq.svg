<svg xmlns="http://www.w3.org/2000/svg" width="900" height="569" viewBox="0 0 900 569" role="img" aria-labelledby="title desc"><title id="title">Bëje kritikën të përdorshme</title><desc id="desc">Bëje kritikën të përdorshme. Emërto ngjarjen: Çfarë ndodhi konkretisht?. Shpjego shqetësimin: Pse pati rëndësi për ty?. Lër vend për përgjigje: Tjetri ka kontekst që mund të mos e dish.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Bëje kritikën të përdorshme</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Emërto ngjarjen</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Çfarë ndodhi konkretisht?</text><rect x="460.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Shpjego shqetësimin</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Pse pati rëndësi për ty?</text><rect x="40" y="347.0" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="379.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Lër vend për përgjigje</text><text x="58" y="423.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Tjetri ka kontekst që mund të mos e dish.</text><text x="40" y="504.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
