<svg xmlns="http://www.w3.org/2000/svg" width="900" height="739" viewBox="0 0 900 739" role="img" aria-labelledby="title desc"><title id="title">Pak llogaritje për biletat</title><desc id="desc">Një i rritur: tri bileta teke 12,30 € ose ditore 8,20 €. Tre të rritur: bileta ditore 24,60 € ose grupi 16,40 €.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Pak llogaritje për biletat</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Hamburg AB · tarifat e plota në euro</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><text x="40" y="197.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">1 i rritur · 3 bileta teke</text><text x="860" y="247.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">12,30 €</text><rect x="40" y="259.79999999999995" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="259.79999999999995" width="410.000" height="22" rx="3" fill="#a87653"/><text x="40" y="311.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">1 i rritur · biletë ditore</text><text x="860" y="361.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">8,20 €</text><rect x="40" y="373.99999999999994" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="373.99999999999994" width="273.333" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="425.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">3 të rritur · bileta ditore</text><text x="860" y="476.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">24,60 €</text><rect x="40" y="488.19999999999993" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="488.19999999999993" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="540.1999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">3 të rritur · biletë grupi</text><text x="860" y="590.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">16,40 €</text><rect x="40" y="602.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="602.4" width="546.667" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="646.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="646.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="674.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Burimi: HVV · 23 shtator 2026. Grupi udhëton bashkë.</text></svg>
