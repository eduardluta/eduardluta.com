<svg xmlns="http://www.w3.org/2000/svg" width="420" height="696" viewBox="0 0 420 696" role="img" aria-labelledby="title desc"><title id="title">Pak llogaritje për biletat</title><desc id="desc">Një i rritur: tri bileta teke 12,30 € ose ditore 8,20 €. Tre të rritur: bileta ditore 24,60 € ose grupi 16,40 €.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Pak llogaritje për</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">biletat</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hamburg AB · tarifat e plota në euro</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><text x="24" y="193.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1 i rritur · 3 bileta teke</text><text x="396" y="233.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">12,30 €</text><rect x="24" y="245.79999999999998" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="245.79999999999998" width="186.000" height="22" rx="3" fill="#a87653"/><text x="24" y="297.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">1 i rritur · biletë ditore</text><text x="396" y="337.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">8,20 €</text><rect x="24" y="349.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="349.99999999999994" width="124.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="401.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">3 të rritur · bileta ditore</text><text x="396" y="442.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">24,60 €</text><rect x="24" y="454.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="454.19999999999993" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="506.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">3 të rritur · biletë grupi</text><text x="396" y="546.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">16,40 €</text><rect x="24" y="558.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="558.4" width="248.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="602.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="602.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="630.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Burimi: HVV · 23 shtator 2026. Grupi</text><text x="24" y="651.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">udhëton bashkë.</text></svg>
