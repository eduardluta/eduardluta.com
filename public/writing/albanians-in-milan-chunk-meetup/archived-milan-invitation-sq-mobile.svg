<svg xmlns="http://www.w3.org/2000/svg" width="420" height="732" viewBox="0 0 420 732" role="img" aria-labelledby="title desc"><title id="title">Ftesa e ruajtur</title><desc id="desc">Ftesa e arkivuar për 8 tetor 2026: nga 18:30 deri në 20:00 te Chunk Milano, Ripa di Porta Ticinese 55, për kafe e muhabet.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Ftesa e ruajtur</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">8 tetor 2026 • njoftim i një date të</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kaluar</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><rect x="24" y="176.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="208.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kur</text><text x="42" y="246.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">18:30–20:00, një orar takimi</text><text x="42" y="271.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">prej 90 minutash.</text><rect x="24" y="337.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="369.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ku</text><text x="42" y="406.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Chunk Milano · Ripa di Porta</text><text x="42" y="431.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Ticinese 55.</text><rect x="24" y="498.0" width="372" height="140.6" rx="