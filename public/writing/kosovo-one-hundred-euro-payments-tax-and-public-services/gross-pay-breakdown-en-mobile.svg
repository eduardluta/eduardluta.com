<svg xmlns="http://www.w3.org/2000/svg" width="420" height="655" viewBox="0 0 420 655" role="img" aria-labelledby="title desc"><title id="title">Where a €1,000 gross salary goes</title><desc id="desc">Where a €1,000 gross salary goes. Net pay: €884; Employee pension contribution: €50; Personal income tax: €66</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Where a €1,000 gross</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">salary goes</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Illustration: primary employer, 5%</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">employee pension, no other adjustments.</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">€884 + €50 + €66 = €1,000.</text><path d="M 24 210.6 H 396" stroke="#d9d3c8"/><text x="24" y="235.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Net pay</text><text x="396" y="275.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€884</text><rect x="24" y="287.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="287.8" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="339.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Employee pension contribution</text><text x="396" y="380.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€50</text><rect x="24" y="392.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="392.0" width="21.041" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="444.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Personal income tax</text><text x="396" y="484.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€66</text><rect x="24" y="496.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="496.2" width="27.774" height="22" rx="3" fill="#a87653"/><text x="24" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="540.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="568.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Illustration: primary employer, 5%</text><text x="24" y="589.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">employee pension, no other adjustments.</text><text x="24" y="610.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">€884 + €50 + €66 = €1,000.</text></svg>
