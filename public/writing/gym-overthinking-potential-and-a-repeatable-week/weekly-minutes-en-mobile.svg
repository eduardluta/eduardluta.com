<svg xmlns="http://www.w3.org/2000/svg" width="420" height="697" viewBox="0 0 420 697" role="img" aria-labelledby="title desc"><title id="title">Three ways to add up 150 minutes</title><desc id="desc">Three ways to add up 150 minutes. 5 × 30 minutes: 150 min / week; 3 × 50 minutes: 150 min / week; 10 × 15 minutes: 150 min / week</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Three ways to add up</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">150 minutes</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Arithmetic examples for moderate aerobic</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">activity. Not leg-press minutes, a</text><text x="24" y="176.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">personal programme or proof of equal</text><text x="24" y="197.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">effects.</text><path d="M 24 231.6 H 396" stroke="#d9d3c8"/><text x="24" y="256.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">5 × 30 minutes</text><text x="396" y="296.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">150 min / week</text><rect x="24" y="308.8" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="308.8" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="360.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">3 × 50 minutes</text><text x="396" y="401.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">150 min / week</text><rect x="24" y="413.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="413.0" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="465.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">10 × 15 minutes</text><text x="396" y="505.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">150 min / week</text><rect x="24" y="517.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="517.2" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="561.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="561.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="24" y="589.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Arithmetic examples for moderate aerobic</text><text x="24" y="610.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">activity. Not leg-press minutes, a</text><text x="24" y="631.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">personal programme or proof of equal</text><text x="24" y="652.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">effects.</text></svg>
