<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675" role="img" aria-labelledby="title desc"><title id="title">Tri mënyra për t’i mbledhur 150 minuta</title><desc id="desc">Tri mënyra për t’i mbledhur 150 minuta. 5 × 30 minuta: 150 min / javë; 3 × 50 minuta: 150 min / javë; 10 × 15 minuta: 150 min / javë</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Tri mënyra për t’i mbledhur 150 minuta</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembuj aritmetikë për aktivitet aerobik mesatar. Jo minuta leg-press,</text><text x="40" y="159.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">program personal apo provë efektesh të barabarta.</text><path d="M 40 197.79999999999998 H 860" stroke="#d9d3c8"/><text x="40" y="222.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">5 × 30 minuta</text><text x="860" y="273.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">150 min / javë</text><rect x="40" y="285.0" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="285.0" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="337.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">3 × 50 minuta</text><text x="860" y="387.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">150 min / javë</text><rect x="40" y="399.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="399.2" width="820.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="451.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">10 × 15 minuta</text><text x="860" y="501.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">150 min / javë</text><rect x="40" y="513.4" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="513.4" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="557.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="557.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="585.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shembuj aritmetikë për aktivitet aerobik mesatar. Jo minuta leg-press,</text><text x="40" y="610.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">program personal apo provë efektesh të barabarta.</text></svg>
