<svg xmlns="http://www.w3.org/2000/svg" width="420" height="696" viewBox="0 0 420 696" role="img" aria-labelledby="title desc"><title id="title">Bleje ditën që do ta përdorësh</title><desc id="desc">Muzeu 106 CHF; me një atraksion 162 CHF; paketat ditore 182 CHF; muzeu me dy atraksione 218 CHF.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Bleje ditën që do ta</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">përdorësh</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">2 të rritur + 2 fëmijë 6–15 vjeç · CHF</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><text x="24" y="193.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vetëm muzeu</text><text x="396" y="233.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">106 CHF</text><rect x="24" y="245.79999999999998" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="245.79999999999998" width="180.881" height="22" rx="3" fill="#a87653"/><text x="24" y="297.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Muzeu + 1 atraksion</text><text x="396" y="337.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">162 CHF</text><rect x="24" y="349.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="349.99999999999994" width="276.440" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="401.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Paketat ditore</text><text x="396" y="442.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">182 CHF</text><rect x="24" y="454.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="454.19999999999993" width="310.569" height="22" rx="3" fill="#a87653"/><text x="24" y="506.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Muzeu + 2 atraksione</text><text x="396" y="546.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">218 CHF</text><rect x="24" y="558.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="558.4" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="602.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="602.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="630.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Tarifat standarde zyrtare · 23 shtator</text><text x="24" y="651.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">2026. Familje ilustruese.</text></svg>
