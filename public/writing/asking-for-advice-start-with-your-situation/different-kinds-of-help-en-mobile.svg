<svg xmlns="http://www.w3.org/2000/svg" width="420" height="665" viewBox="0 0 420 665" role="img" aria-labelledby="title desc"><title id="title">Name the kind of help</title><desc id="desc">Name the kind of help. Feedback: Review something you have made.. Information: Explain a process or point to a source.. Support: Listen or help with a practical burden.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Name the kind of help</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="115.4" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Feedback</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Review something you have made.</text><rect x="24" y="291.20000000000005" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="323.20000000000005" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Information</text><text x="42" y="360.40000000000003" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Explain a process or point to a</text><text x="42" y="385.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">source.</text><rect x="24" y="451.80000000000007" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="483.80000000000007" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Support</text><text x="42" y="521.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Listen or help with a practical</text><text x="42" y="546.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">burden.</text><text x="24" y="620.4000000000001" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
