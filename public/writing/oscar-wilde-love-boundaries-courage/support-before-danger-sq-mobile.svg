<svg xmlns="http://www.w3.org/2000/svg" width="420" height="753" viewBox="0 0 420 753" role="img" aria-labelledby="title desc"><title id="title">Kur situata mund të jetë e pasigurt</title><desc id="desc">Kur situata mund të jetë e pasigurt. Dallo: Shiko kërcënimet, kontrollin dhe frikën konkrete.. Kërko mbështetje: Fol me një person të besuar ose shërbim të specializuar.. Planifiko me siguri: Kërko këshillim para largimit; në rrezik të menjëhershëm, ndihmë emergjente lokale.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Kur situata mund të</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">jetë e pasigurt</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Dallo</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shiko kërcënimet, kontrollin</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">dhe frikën konkrete.</text><rect x="24" y="354.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="386.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kërko mbështetje</text><text x="42" y="423.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Fol me një person të besuar ose</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">shërbim të specializuar.</text><rect x="24" y="514.8" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="546.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Planifiko me siguri</text><text x="42" y="584.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kërko këshillim para largimit;</text><text x="42" y="609.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">në rrezik të menjëhershëm,</text><text x="42" y="634.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ndihmë emergjente lokale.</text><text x="24" y="708.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
