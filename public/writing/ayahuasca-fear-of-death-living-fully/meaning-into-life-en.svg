<svg xmlns="http://www.w3.org/2000/svg" width="900" height="601" viewBox="0 0 900 601" role="img" aria-labelledby="title desc"><title id="title">Bring the question back to this life</title><desc id="desc">Bring the question back to this life. Time: What am I postponing?. Creation: What can I make or contribute?. Love: Who deserves my attention today?</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Bring the question back to this life</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Time</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What am I postponing?</text><rect x="460.0" y="197.6" width="400.0" height="161.59999999999997" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Creation</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What can I make or</text><text x="478.0" y="306.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">contribute?</text><rect x="40" y="379.19999999999993" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="411.19999999999993" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Love</text><text x="58" y="455.3999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Who deserves my attention today?</text><text x="40" y="536.5999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
