<svg xmlns="http://www.w3.org/2000/svg" width="420" height="613" viewBox="0 0 420 613" role="img" aria-labelledby="title desc"><title id="title">Distanca e vrapimit, jo përpjekja totale</title><desc id="desc">Distanca e vrapimit, jo përpjekja totale. Seanca e mëparshme: 3 km; Kjo seancë: 4 km; Formati i plotë: 8 km</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Distanca e vrapimit, jo</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">përpjekja totale</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Planet e seancave në video krahasuar me</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">formatin standard të organizatorit.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Seanca e mëparshme</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">3 km</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="139.500" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kjo seancë</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">4 km</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="186.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="422.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Formati i plotë</text><text x="396" y="463.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">8 km</text><rect x="24" y="475.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="475.19999999999993" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="519.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="519.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="547.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Planet e seancave në video krahasuar me</text><text x="24" y="568.1999999999999" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">formatin standard të organizatorit.</text></svg>
