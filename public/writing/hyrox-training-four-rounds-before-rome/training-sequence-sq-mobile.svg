<svg xmlns="http://www.w3.org/2000/svg" width="420" height="690" viewBox="0 0 420 690" role="img" aria-labelledby="title desc"><title id="title">Seanca në video</title><desc id="desc">Seanca në video. Vrapim dhe ushtrim: Alterno një kilometër me një ushtrim.. Katër runde: SkiErg, vozitje, bartje peshash dhe hapa të thellë.. Shqyrto: Vëre ritmin, kalimet dhe teknikën.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Seanca në video</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Vrapim dhe ushtrim</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Alterno një kilometër me një</text><text x="42" y="250.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ushtrim.</text><rect x="24" y="316.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="348.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Katër runde</text><text x="42" y="385.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">SkiErg, vozitje, bartje peshash</text><text x="42" y="410.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">dhe hapa të thellë.</text><rect x="24" y="477.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="509.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Shqyrto</text><text x="42" y="546.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vëre ritmin, kalimet dhe</text><text x="42" y="571.4000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">teknikën.</text><text x="24" y="645.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
