<svg xmlns="http://www.w3.org/2000/svg" width="420" height="471" viewBox="0 0 420 471" role="img" aria-labelledby="title desc"><title id="title">Krahaso çfarë mbetet</title><desc id="desc">Krahaso çfarë mbetet. Skenari i tanishëm: €250 / muaj; Skenari i zhvendosjes: €350 / muaj</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Krahaso çfarë mbetet</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Buxhete të sajuara: të ardhurat neto minus</text><text x="24" y="117.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kostot, jo vlerësime tregu.</text><path d="M 24 151.8 H 396" stroke="#d9d3c8"/><text x="24" y="176.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Skenari i tanishëm</text><text x="396" y="217.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€250 / muaj</text><rect x="24" y="229.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="229.0" width="265.714" height="22" rx="3" fill="#a87653"/><text x="24" y="281.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Skenari i zhvendosjes</text><text x="396" y="321.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">€350 / muaj</text><rect x="24" y="333.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="333.2" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="377.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="377.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="405.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Buxhete të sajuara: të ardhurat neto minus</text><text x="24" y="426.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">kostot, jo vlerësime tregu.</text></svg>
