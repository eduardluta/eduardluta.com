<svg xmlns="http://www.w3.org/2000/svg" width="420" height="766" viewBox="0 0 420 766" role="img" aria-labelledby="title desc"><title id="title">A profile is the beginning of knowing someone</title><desc id="desc">A profile is the beginning of knowing someone. The photograph: An impression from a selected moment. The follower count: A visible number, not a measure of character. The conversation: A chance to learn how you actually relate.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">A profile is the</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">beginning of knowing</text><text x="24" y="126.6" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">someone</text><text x="24" y="172.39999999999998" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">A practical way to think about the video</text><path d="M 24 206.39999999999998 H 396" stroke="#d9d3c8"/><rect x="24" y="231.39999999999998" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="263.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The photograph</text><text x="42" y="300.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">An impression from a selected</text><text x="42" y="325.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">moment.</text><rect x="24" y="392.0" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="424.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The follower count</text><text x="42" y="461.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A visible number, not a measure</text><text x="42" y="486.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">of character.</text><rect x="24" y="552.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="584.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">The conversation</text><text x="42" y="621.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A chance to learn how you</text><text x="42" y="647.0000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">actually relate.</text><text x="24" y="721.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Editorial guide, not a measured outcome.</text></svg>
