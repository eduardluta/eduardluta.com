<svg xmlns="http://www.w3.org/2000/svg" width="420" height="508" viewBox="0 0 420 508" role="img" aria-labelledby="title desc"><title id="title">Dy javë të mundshme praktike</title><desc id="desc">Dy javë të mundshme praktike. 4 seanca × 25 minuta: 100 min/javë; 5 seanca × 15 minuta: 75 min/javë</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Dy javë të mundshme</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">praktike</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Orare ilustruese. Koha nuk është matje</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">aftësie.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">4 seanca × 25 minuta</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">100 min/javë</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="372.000" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">5 seanca × 15 minuta</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">75 min/javë</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="279.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="414.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="414.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="442.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Orare ilustruese. Koha nuk është matje</text><text x="24" y="463.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">aftësie.</text></svg>
