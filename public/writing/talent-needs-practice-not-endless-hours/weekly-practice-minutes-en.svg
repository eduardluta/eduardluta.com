<svg xmlns="http://www.w3.org/2000/svg" width="900" height="511" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">Two possible weeks of practice</title><desc id="desc">Two possible weeks of practice. 4 sessions × 25 minutes: 100 min/week; 5 sessions × 15 minutes: 75 min/week</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Two possible weeks of practice</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Illustrative schedules. Time is not a measure of skill.</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><text x="40" y="197.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">4 sessions × 25 minutes</text><text x="860" y="247.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">100 min/week</text><rect x="40" y="259.79999999999995" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="259.79999999999995" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="311.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">5 sessions × 15 minutes</text><text x="860" y="361.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">75 min/week</text><rect x="40" y="373.99999999999994" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="373.99999999999994" width="615.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="417.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="417.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="40" y="445.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Illustrative schedules. Time is not a measure of skill.</text></svg>
