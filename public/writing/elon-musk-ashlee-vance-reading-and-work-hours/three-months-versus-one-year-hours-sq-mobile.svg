<svg xmlns="http://www.w3.org/2000/svg" width="420" height="450" viewBox="0 0 420 450" role="img" aria-labelledby="title desc"><title id="title">Numëroji orët më vete</title><desc id="desc">Orë hipotetike: trembëdhjetë javë me njëqind orë japin 1.300; pesëdhjetë e dy javë me dyzet japin 2.080.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Numëroji orët më vete</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Totale ilustruese • jo rezultat i matur</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><text x="24" y="155.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">13 javë × 100 orë</text><text x="396" y="196.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">1.300 orë</text><rect x="24" y="208.0" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="208.0" width="232.500" height="22" rx="3" fill="#a87653"/><text x="24" y="260.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">52 javë × 40 orë</text><text x="396" y="300.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">2.080 orë</text><rect x="24" y="312.2" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="312.2" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="356.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="356.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="384.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Llogaritje origjinale • Supozimet në</text><text x="24" y="405.2" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">shënimin 3</text></svg>
