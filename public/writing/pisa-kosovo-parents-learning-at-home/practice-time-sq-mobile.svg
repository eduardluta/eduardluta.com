<svg xmlns="http://www.w3.org/2000/svg" width="420" height="717" viewBox="0 0 420 717" role="img" aria-labelledby="title desc"><title id="title">Një rutinë ilustruese katërjavore</title><desc id="desc">Një rutinë ilustruese katërjavore. Java 1: 75 min; Java 2: 150 min; Java 3: 225 min; Java 4: 300 min</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një rutinë ilustruese</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">katërjavore</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Kohë e planifikuar kumulative: 15 minuta ×</text><text x="24" y="155.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">5 mbrëmje/javë. Jo premtim rezultati.</text><path d="M 24 189.6 H 396" stroke="#d9d3c8"/><text x="24" y="214.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Java 1</text><text x="396" y="254.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">75 min</text><rect x="24" y="266.79999999999995" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="266.79999999999995" width="93.000" height="22" rx="3" fill="#a87653"/><text x="24" y="318.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Java 2</text><text x="396" y="358.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">150 min</text><rect x="24" y="370.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="370.99999999999994" width="186.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="422.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Java 3</text><text x="396" y="463.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">225 min</text><rect x="24" y="475.19999999999993" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="475.19999999999993" width="279.000" height="22" rx="3" fill="#a87653"/><text x="24" y="527.1999999999999" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Java 4</text><text x="396" y="567.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">300 min</text><rect x="24" y="579.4" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="579.4" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="623.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="623.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="651.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Kohë e planifikuar kumulative: 15 minuta ×</text><text x="24" y="672.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">5 mbrëmje/javë. Jo premtim rezultati.</text></svg>
