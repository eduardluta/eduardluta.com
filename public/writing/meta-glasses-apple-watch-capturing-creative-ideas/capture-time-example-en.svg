<svg xmlns="http://www.w3.org/2000/svg" width="900" height="561" viewBox="0 0 900 561" role="img" aria-labelledby="title desc"><title id="title">Example: five captures per day</title><desc id="desc">Example: five captures per day. At 20 seconds each: 100 seconds/day; At 5 seconds each: 25 seconds/day</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Example: five captures per day</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Hypothetical timings, not device benchmarks. Difference: 75 seconds/day; 525</text><text x="40" y="159.6" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">seconds over 7 days.</text><path d="M 40 197.79999999999998 H 860" stroke="#d9d3c8"/><text x="40" y="222.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">At 20 seconds each</text><text x="860" y="273.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">100 seconds/day</text><rect x="40" y="285.0" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="285.0" width="820.000" height="22" rx="3" fill="#a87653"/><text x="40" y="337.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">At 5 seconds each</text><text x="860" y="387.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">25 seconds/day</text><rect x="40" y="399.2" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="399.2" width="205.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="443.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="443.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">All bars start at zero</text><text x="40" y="471.2" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Hypothetical timings, not device benchmarks. Difference: 75 seconds/day; 525</text><text x="40" y="496.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">seconds over 7 days.</text></svg>
