<svg xmlns="http://www.w3.org/2000/svg" width="420" height="466" viewBox="0 0 420 466" role="img" aria-labelledby="title desc"><title id="title">Kush tha se e kishte parë kllounin?</title><desc id="desc">E kishin vënë re: 25 për qind gjatë bisedës në telefon, 51,3 për qind duke ecur vetëm pa pajisje elektronike.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Kush tha se e kishte</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">parë kllounin?</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Studimi 2 • pyetje e drejtpërdrejtë</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><text x="24" y="193.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Bisedë në telefon (n=24)</text><text x="396" y="233.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">25%</text><rect x="24" y="245.79999999999998" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="245.79999999999998" width="181.287" height="22" rx="3" fill="#a87653"/><text x="24" y="297.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Vetëm, pa pajisje (n=78)</text><text x="396" y="337.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">51,3%</text><rect x="24" y="349.99999999999994" width="372" height="22" rx="3" fill="#d9d3c8"/><rect x="24" y="349.99999999999994" width="372.000" height="22" rx="3" fill="#2f5d4f"/><text x="24" y="393.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">0</text><text x="396" y="393.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="24" y="421.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Hyman e bashkautorët (2010) • Tabela 2</text></svg>
