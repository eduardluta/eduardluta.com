<svg xmlns="http://www.w3.org/2000/svg" width="420" height="939" viewBox="0 0 420 939" role="img" aria-labelledby="title desc"><title id="title">Jepi vlerës një veprim të përditshëm</title><desc id="desc">Jepi vlerës një veprim të përditshëm. Emërto vlerën: Çfarë ka rëndësi këtu: ndershmëria, kujdesi, guximi apo mbajtja e fjalës. Zgjidh veprimin: Çfarë më kërkon kjo vlerë të bëj, edhe kur askush nuk më sheh. Shiko ndikimin: Kush përfiton dhe kush e bart koston e zgjedhjes sime. Kthehu dhe përmirëso: A e mbajta fjalën? Nëse jo, çfarë duhet të ndryshoj.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Jepi vlerës një veprim</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">të përditshëm</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Emërto vlerën</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë ka rëndësi këtu:</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">ndershmëria, kujdesi, guximi</text><text x="42" y="313.19999999999993" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">apo mbajtja e fjalës?</text><rect x="24" y="379.4" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="411.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Zgjidh veprimin</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Çfarë më kërkon kjo vlerë të</text><text x="42" y="473.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">bëj, edhe kur askush nuk më</text><text x="42" y="498.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">sheh?</text><rect x="24" y="565.1999999999999" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="597.1999999999999" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Shiko ndikimin</text><text x="42" y="634.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kush përfiton dhe kush e bart</text><text x="42" y="659.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">koston e zgjedhjes sime?</text><rect x="24" y="725.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="757.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kthehu dhe përmirëso</text><text x="42" y="795.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">A e mbajta fjalën? Nëse jo,</text><text x="42" y="820.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">çfarë duhet të ndryshoj?</text><text x="24" y="894.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
