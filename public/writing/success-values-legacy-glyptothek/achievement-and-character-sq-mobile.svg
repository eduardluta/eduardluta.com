<svg xmlns="http://www.w3.org/2000/svg" width="420" height="580" viewBox="0 0 420 580" role="img" aria-labelledby="title desc"><title id="title">Dy pyetje për suksesin</title><desc id="desc">Dy pyetje për suksesin. Çfarë arrita?: Një projekt, të ardhura, një emër. Rezultati që të tjerët mund ta shohin. Kush u bëra?: Si e mbajta fjalën dhe si i trajtova njerëzit që e bënë rrugën me mua.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Dy pyetje për suksesin</text><text x="24" y="96.8" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 130.8 H 396" stroke="#d9d3c8"/><rect x="24" y="155.8" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="187.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Çfarë arrita?</text><text x="42" y="225.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Një projekt, të ardhura, një</text><text x="42" y="250.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">emër. Rezultati që të tjerët</text><text x="42" y="275.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">mund ta shohin.</text><rect x="24" y="341.6" width="372" height="165.79999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="373.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Kush u bëra?</text><text x="42" y="410.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Si e mbajta fjalën dhe si i</text><text x="42" y="436.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">trajtova njerëzit që e bënë</text><text x="42" y="461.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">rrugën me mua.</text><text x="24" y="535.4" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
