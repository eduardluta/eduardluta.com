<svg xmlns="http://www.w3.org/2000/svg" width="900" height="569" viewBox="0 0 900 569" role="img" aria-labelledby="title desc"><title id="title">Can you question the decision?</title><desc id="desc">Three questions ask whether AI was involved, what affected the result and where to seek review.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Can you question the decision?</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Three practical questions</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><rect x="40.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Notice</text><text x="58.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Was AI involved?</text><rect x="460.0" y="197.6" width="400.0" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="478.0" y="229.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Reason</text><text x="478.0" y="273.8" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">What affected this result?</text><rect x="40" y="347.0" width="820" height="129.39999999999998" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="58" y="379.0" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start">Challenge</text><text x="58" y="423.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Where can I ask for a review?</text><text x="40" y="504.4" fill="#655e55" font-family="Arial, sans-serif" font-siz