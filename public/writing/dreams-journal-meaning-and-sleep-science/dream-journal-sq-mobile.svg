<svg xmlns="http://www.w3.org/2000/svg" width="420" height="889" viewBox="0 0 420 889" role="img" aria-labelledby="title desc"><title id="title">Një faqe në ditarin e ëndrrave</title><desc id="desc">Një faqe në ditarin e ëndrrave. Skena: Shëno hollësitë që kujton dhe boshllëqet.. Emocioni: Emërtoje ndjenjën përpara analizës.. Alternativat: Shkruaj më shumë se një lidhje të mundshme.. Veprimi tjetër: Zgjidh një hap të dobishëm ose lëre të hapur.</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="24" y="51" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">Një faqe në ditarin e</text><text x="24" y="88.8" fill="#1b1712" font-family="Georgia, serif" font-size="27" font-weight="normal" text-anchor="start">ëndrrave</text><text x="24" y="134.6" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Një mënyrë praktike për ta menduar videon</text><path d="M 24 168.6 H 396" stroke="#d9d3c8"/><rect x="24" y="193.6" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="225.6" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Skena</text><text x="42" y="262.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shëno hollësitë që kujton dhe</text><text x="42" y="287.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">boshllëqet.</text><rect x="24" y="354.2" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="386.2" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Emocioni</text><text x="42" y="423.4" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Emërtoje ndjenjën përpara</text><text x="42" y="448.59999999999997" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">analizës.</text><rect x="24" y="514.8" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="546.8" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Alternativat</text><text x="42" y="584.0" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Shkruaj më shumë se një lidhje</text><text x="42" y="609.2" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">të mundshme.</text><rect x="24" y="675.4" width="372" height="140.6" rx="7" fill="#fffdf8" stroke="#d9d3c8"/><text x="42" y="707.4" fill="#2f5d4f" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Veprimi tjetër</text><text x="42" y="744.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Zgjidh një hap të dobishëm ose</text><text x="42" y="769.8000000000001" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">lëre të hapur.</text><text x="24" y="844.0" fill="#655e55" font-family="Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Udhëzues editorial, jo rezultat i matur.</text></svg>
