<svg xmlns="http://www.w3.org/2000/svg" width="900" height="511" viewBox="0 0 900 511" role="img" aria-labelledby="title desc"><title id="title">Njëzet minuta, të përsëritura</title><desc id="desc">Njëzet minuta, të përsëritura. Një ditë: 20 minuta; Shtatë ditë: 140 minuta</desc><rect width="100%" height="100%" fill="#f7f4ee"/><text x="40" y="76" fill="#1b1712" font-family="Georgia, serif" font-size="36" font-weight="normal" text-anchor="start">Njëzet minuta, të përsëritura</text><text x="40" y="134.4" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kohë e zgjedhur ilustruese; jo matje ekrani apo synim ushtrimesh.</text><path d="M 40 172.6 H 860" stroke="#d9d3c8"/><text x="40" y="197.6" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Një ditë</text><text x="860" y="247.79999999999998" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">20 minuta</text><rect x="40" y="259.79999999999995" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="259.79999999999995" width="117.143" height="22" rx="3" fill="#a87653"/><text x="40" y="311.79999999999995" fill="#1b1712" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start">Shtatë ditë</text><text x="860" y="361.99999999999994" fill="#1b1712" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="end">140 minuta</text><rect x="40" y="373.99999999999994" width="820" height="22" rx="3" fill="#d9d3c8"/><rect x="40" y="373.99999999999994" width="820.000" height="22" rx="3" fill="#2f5d4f"/><text x="40" y="417.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">0</text><text x="860" y="417.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="end">Të gjithë shiritat fillojnë nga zero</text><text x="40" y="445.99999999999994" fill="#655e55" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start">Kohë e zgjedhur ilustruese; jo matje ekrani apo synim ushtrimesh.</text></svg>
